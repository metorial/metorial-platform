[package]
name = "lowerdeck-doctor"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Doctor protocol: dependency checks with actionable, redacted reports"
publish = false

[features]
default = []
axum = ["dep:axum"]
aws = ["dep:aws-smithy-types"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures = "0.3"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt", "sync", "time"] }

axum = { version = "0.7", optional = true, default-features = false }
aws-smithy-types = { version = "1.3", optional = true }

[dev-dependencies]
http-body-util = "0.1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "test-util", "time"] }
tower = { version = "0.5", features = ["util"] }

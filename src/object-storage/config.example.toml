# Example configuration file for the object storage service
# Copy this to config.toml and modify as needed

[server]
# Host to bind to
# Use "127.0.0.1" for local-only access
# Use "0.0.0.0" to accept connections from any interface (required for Docker)
host = "0.0.0.0"
port = 8080

[backend]
# Backend type: "local", "s3", "gcs", or "azure"
type = "local"

# For local backend:
root_path = "/app/data"  # Use "./data" for local development
physical_bucket = "object-store-data"
# Base URL clients reach this service at; public URLs are unsigned links to it
# public_url = "http://localhost:8080"

# For S3 backend (also MinIO, Ceph and other S3-compatible stores):
# type = "s3"
# region = "us-east-1"
# physical_bucket = "my-bucket"
# endpoint = "http://localhost:9000"        # Optional; implies path-style addressing
# public_endpoint = "https://s3.example.com" # Optional; host that signed URLs point at
# force_path_style = true

# For GCS backend (Application Default Credentials unless credentials_file is set):
# type = "gcs"
# physical_bucket = "my-gcs-bucket"
# endpoint = "http://localhost:4443"        # Optional, for emulators
# public_endpoint = "https://storage.example.com"
# credentials_file = "/etc/gcs/key.json"

# For Azure backend (keyless unless access_key or connection_string is set):
# type = "azure"
# account = "myaccount"
# physical_bucket = "mycontainer"
# access_key = "myaccesskey"
# connection_string = "..."                  # Alternative to account + access_key
# auth = "default"                           # access_key | default | workload_identity | managed_identity
# endpoint = "http://localhost:10000/devstoreaccount1"
# public_endpoint = "https://myaccount.blob.example.com"

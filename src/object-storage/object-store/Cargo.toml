[package]
name = "object-store"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[[bin]]
name = "object-store-service"
path = "src/main.rs"

[dependencies]
object-store-backends = { path = "../object-store-backends" }

tokio = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
mime_guess = { workspace = true }
futures = "0.3"
bytes = "1.5"
tokio-util = { version = "0.7", features = ["rt"] }
sha2 = { workspace = true }
hex = { workspace = true }

# Zip archives (pure-Rust Deflate so compressed output is deterministic)
crc32fast = "1.4"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
unicode-normalization = "0.1.24"

# Configuration
config = "0.14"

# HTTP client for health checks
reqwest = "0.11"

[dev-dependencies]
tempfile = "3.8"
mockall = { workspace = true }
futures = "0.3"
sha2 = { workspace = true }
hex = { workspace = true }
proptest = "1.11"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
reqwest = { version = "0.11", features = ["stream"] }

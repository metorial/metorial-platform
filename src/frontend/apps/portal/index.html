<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Metorial</title>

  <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="shortcut icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-title" content="Metorial" />
  <link rel="manifest" href="/site.webmanifest" />


  <style>
    body {
      margin: 0;
      padding: 0;
      background: #efefef;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    .mte_boot {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      display: flex;
      background: #efefef;
    }

    .mte_boot_center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      flex-grow: 1;
      gap: 50px;
    }

    .mte_boot_center img {
      height: 80px;
      width: 80px;
      filter: brightness(0);
    }

    .mte_boot_spinner {
      border: 4px solid #ddd;
      border-top: 4px solid #999;
      border-radius: 50%;
      width: 30px;
      height: 30px;
      animation: mte_boot_spin 0.8s ease-in-out infinite;
    }

    @keyframes mte_boot_spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }
  </style>
</head>

<body>
  <div id="root"></div>

  <div class="mte_boot">
    <div class="mte_boot_center">
      <img src="https://cdn.metorial.com/2025-06-13--14-59-55/logos/metorial/primary_logo/raw.svg"
        alt="Metorial Logo" />

      <div class="mte_boot_spinner"></div>
    </div>
  </div>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>

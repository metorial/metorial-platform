name = "@metorial/nebula"
group = "oss"

[test.e2e]
start = ["test:start-e2e"]

[dev]
run = ["dev:start"]

[endpoints.api]
port = 52170
env = [{ key = "NEBULA_API_PORT", value = "{{PORT}}" }]

[[resources]]
type = "redis"
env = [{ key = "REDIS_URL", value = "redis://{{HOSTNAME}}:{{PORT}}/0" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
DEFAULT_PROVIDER = "local"
LOCAL_MASTER_SECRET = "local-dev-nebula-master-secret-with-enough-entropy"
KMS_AWS_REGION = "us-east-1"
KMS_CREATE_DEFAULT_KEY = "false"
CONSUMER_INSTANCE_TOKEN_SECRET = "local-dev-nebula-consumer-token-secret-with-enough-entropy"
CONSUMER_INSTANCE_TOKEN_TTL_SECONDS = "3600"
CONSUMER_REGISTRATION_SLATES = "local-dev-nebula-slates-registration-secret"
CONSUMER_REGISTRATION_SHUTTLE = "local-dev-nebula-shuttle-registration-secret"

[dev.db.main]
package = "@metorial/nebula"
name = "nebula"
engine = "postgres"
env = "DATABASE_URL"

name = "@metorial/app-api"
group = "oss"
mode = "oss"
dependencies = [
  "@metorial/object-storage",
  "@metorial/ares",
  "@metorial/code-bucket-service-generated",
  "@metorial/nebula",
  "@metorial/relay",
  "@metorial/synthesis",
  "@metorial-subspace/app-controller",
  "@metorial/voyager",
]

[test.e2e]
start = ["bun ./src/server.ts"]
packages = [
  "@metorial/module-organization",
  "@metorial/module-machine-access",
  "@metorial/module-consumer",
]

[dev]
run = ["bun --watch ./src/server.ts"]

[[dev.expose]]
port = 4310

[[dev.expose]]
port = 4311

[[dev.expose]]
port = 4315

[[dev.expose]]
port = 4318

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
EMAIL_SES_ACCESS_KEY_ID = true
EMAIL_SES_SECRET_ACCESS_KEY = true
EMAIL_SES_REGION = true
EMAIL_FROM = "dev@metorial.com"
EMAIL_FROM_NAME = "Metorial DEV"
CONSUMER_TOKEN_SECRET = "consumer-token-secret"
CONSUMER_SESSION_SECRET = "consumer-token-secret"
SIGNED_DOWNLOAD_URL_TOKEN_SECRET = "dev-cargo-download-token-secret"
CARGO_REGION = "dev"
DOWNLOAD_PUBLIC_URL = "http://{{HOSTNAME}}:4318"
PORTAL_HOST_TEMPLATE = "http://{{HOSTNAME}}:4304/{portalId}"
PORTAL_REDIRECT_DOMAINS = "{{HOSTNAME}}"
CARGO_SYNC_CLAIM_METORIAL_OWNERSHIP = "false"
REDIS_URL = "redis://localhost:{{CONTROL_PORT_REDIS}}/0"
CARGO_API_URL = "http://localhost:52150/metorial-cargo"
SYNTHESIS_API_URL = "http://localhost:52160/metorial-synthesis"
PROVIDER_OAUTH_TICKET_SECRET = "provider-oauth-ticket-secret"
AUTH_TICKET_SECRET = "auth-ticket-secret"
ENCRYPTION_SECRET = "encryption-secret"
OBJECT_STORAGE_URL = "http://localhost:52010"
FILES_BUCKET_NAME = "mte-files"
USAGE_MONGO_URI = "mongodb://mongo:mongo@localhost:{{CONTROL_PORT_MONGO}}/?authSource=admin"
API_URL = "http://localhost:4310"
FILES_URL = "http://localhost:4318"
APP_URL = "http://localhost:4300"
DASHBOARD_FRONTEND_HOST = "http://localhost:4300"
PORTALS_URL = "http://localhost:4304"
PORTAL_API_PORT = "4315"
AWS_ACCESS_KEY_ID = true
AWS_SECRET_ACCESS_KEY = true
AWS_REGION = true
AWS_ACCOUNT_ID = true
ARES_INTERNAL_URL = "http://localhost:52123/metorial-ares-internal/api"
ARES_AUTH_URL = "http://localhost:52120"
RELAY_URL = "http://localhost:52110/metorial-relay"
EMAIL_NAME = "Metorial DEV"
EMAIL_ADDRESS = "dev@metorial.com"
SUBSPACE_SOLUTION = "metorial-dev"
SUBSPACE_URL = "http://localhost:52070/subspace-controller"
SUBSPACE_CONNECTION_URL = "http://localhost:52072"
VOYAGER_URL = "http://localhost:52060/metorial-voyager"
ORIGIN_URL = "http://localhost:52090/metorial-origin"
CODE_BUCKET_SERVICE_URL = "localhost:5050"
NEBULA_API_URL = "http://localhost:52170/metorial-nebula"
AI_GATEWAY_API_KEY = true
SCOUT_URL = true
SCOUT_TOKEN = true
EXTERNAL_MULTI_REGION_ENDPOINT = "http://localhost:4323"
INTERNAL_MULTI_REGION_ENDPOINT = "http://localhost:4323"

[dev.db.main]
name = "metorial-oss"
engine = "postgres"
env = "DATABASE_URL"

[dev.db.subspace]
name = "subspace"
engine = "postgres"
env = "SUBSPACE_DATABASE_URL"

[dev.db.cargo]
name = "cargo"
engine = "postgres"
env = "CARGO_DATABASE_URL"

[dev.db.global]
name = "metorial-oss-global"
engine = "postgres"
env = "GLOBAL_DATABASE_URL"

[dev.db.usage]
name = "metorial-usage"
engine = "mongodb"
env = "USAGE_MONGO_URL"

name = "@metorial/signal"
group = "oss"

[dev]
run = ["dev:start"]

[endpoints.api]
port = 52050
env = [{ key = "SIGNAL_API_PORT", value = "{{BIND_PORT}}" }]

[[resources]]
type = "redis"
env = [{ key = "REDIS_URL", value = "redis://{{HOSTNAME}}:{{PORT}}/0" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
OBJECT_STORAGE_URL = "http://services:52010"
LOGS_BUCKET_NAME = "signal-logs"

[dev.db.main]
package = "@metorial/signal"
name = "signal"
engine = "postgres"
env = "DATABASE_URL"

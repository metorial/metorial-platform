name = "@metorial/signal"
group = "oss"

[[dependencies]]
identifier = "@metorial/object-storage"
start = false
env = [
  { endpoint = "api", key = "OBJECT_STORAGE_URL", value = "http://{{HOSTNAME}}:{{PORT}}" },
]

[dev]
run = ["dev:start"]

[endpoints.api]
port = 52050
health = "/ping"
env = [{ key = "SIGNAL_API_PORT", value = "{{BIND_PORT}}" }]

[e2e]
start = ["e2e:start"]
image = "signal"

[[resources]]
type = "redis"
env = [{ key = "REDIS_URL", value = "redis://{{HOSTNAME}}:{{PORT}}/0" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
LOGS_BUCKET_NAME = "signal-logs"

[dev.db.main]
package = "@metorial/signal"
name = "signal"
engine = "postgres"
env = "DATABASE_URL"

[[ci.images]]
name = "signal"
group = "oss"
dockerfile = "Dockerfile"
image = "metorial/mte-signal"
ecr = "metorial-enterprise-saas/mte-signal"
canonical = "ghcr.io/metorial/signal"

[e2e.env]
OBJECT_STORAGE_URL = "http://services:52010"

syntax = "proto3";

package rpc.rpc;

option go_package = "github.com/metorial/metorial/services/rpc/gen/rpc;rpc";

service CodeBucket {
  rpc CloneBucket(CloneBucketRequest) returns (CreateBucketResponse);
  rpc CreateBucketFromContents(CreateBucketFromContentsRequest) returns (CreateBucketResponse);
  rpc CreateBucketFromZip(CreateBucketFromZipRequest) returns (CreateBucketResponse);
  rpc CreateBucketFromGithub(CreateBucketFromGithubRequest) returns (CreateBucketResponse);
  rpc CreateBucketFromGitlab(CreateBucketFromGitlabRequest) returns (CreateBucketResponse);
  rpc CreateBucketFromBitbucketCloud(CreateBucketFromBitbucketCloudRequest) returns (CreateBucketResponse);
  rpc CreateBucketFromBitbucketDataCenter(CreateBucketFromBitbucketDataCenterRequest) returns (CreateBucketResponse);

  rpc GetBucketToken(GetBucketTokenRequest) returns (GetBucketTokenResponse);
  rpc GetBucketFile(GetBucketFileRequest) returns (GetBucketFileResponse);
  rpc GetBucketFiles(GetBucketFilesRequest) returns (GetBucketFilesResponse);
  rpc GetBucketFilesWithContent(GetBucketFilesRequest) returns (GetBucketFilesWithContentResponse);
  rpc GetBucketFilesWithContentStream(GetBucketFilesRequest) returns (stream GetBucketFilesWithContentChunk);
  rpc GetBucketFilesAsZip(GetBucketFilesAsZipRequest) returns (GetBucketFilesAsZipResponse);
  rpc GetBucketFilesAsZipStream(GetBucketFilesAsZipRequest) returns (stream GetBucketFilesAsZipChunk);
  rpc ExportBucketFilesAsZipToUpload(ExportBucketFilesAsZipToUploadRequest) returns (ExportBucketFilesAsZipToUploadResponse);

  rpc SetBucketFiles(SetBucketFilesRequest) returns (SetBucketFilesResponse);
  rpc SetBucketFile(SetBucketFileRequest) returns (SetBucketFileResponse);
  rpc CopyBucketFiles(CopyBucketFilesRequest) returns (CopyBucketFilesResponse);
  rpc DeleteBucketFile(DeleteBucketFileRequest) returns (DeleteBucketFileResponse);
  rpc DeleteBucketPath(DeleteBucketPathRequest) returns (DeleteBucketPathResponse);
  rpc PruneBucketPath(PruneBucketPathRequest) returns (PruneBucketPathResponse);

  rpc ExportBucketToGithub(ExportBucketToGithubRequest) returns (ExportBucketToGithubResponse);
  rpc ExportBucketToGitlab(ExportBucketToGitlabRequest) returns (ExportBucketToGitlabResponse);
  rpc ExportBucketToBitbucketCloud(ExportBucketToBitbucketCloudRequest) returns (ExportBucketToBitbucketResponse);
  rpc ExportBucketToBitbucketDataCenter(ExportBucketToBitbucketDataCenterRequest) returns (ExportBucketToBitbucketResponse);
}

message FileInfo {
  string path = 1;
  int64 size = 2;
  string content_type = 3;
  int64 modified_at = 4;
}

message FileContent {
  bytes content = 1;
  FileInfo file_info = 2;
}

message CloneBucketRequest {
  string source_bucket_id = 1;
  string new_bucket_id = 2;
}

message CreateBucketFromZipRequest {
  string new_bucket_id = 1;
  string zip_url = 2;
  string path = 3;
  map<string, string> headers = 4; 
}

message FileContentsBase {
  string path = 1;
  bytes content = 2;
}

message CreateBucketFromContentsRequest {
  string new_bucket_id = 1;
  repeated FileContentsBase contents = 2;
}

message CreateBucketFromGithubRequest {
  string new_bucket_id = 1;
  string owner = 2;
  string repo = 3;
  string path = 4;
  string ref = 5;
  string token = 6;
  string github_api_url = 7;
  string github_lfs_endpoint = 8;
}

message CreateBucketResponse {}

message GetBucketTokenRequest {
  string bucket_id = 1;
  int64 expires_in_seconds = 2;
  bool is_read_only = 3;
}

message GetBucketTokenResponse {
  string token = 1;
}

message GetBucketFileRequest {
  string bucket_id = 1;
  string path = 2;
}

message GetBucketFileResponse {
  FileContent content = 1;
}

message GetBucketFilesRequest {
  string bucket_id = 1;
  string prefix = 2; // Optional filter
}

message GetBucketFilesResponse {
  repeated FileInfo files = 1;
}

message GetBucketFilesWithContentResponse {
  repeated FileContent files = 1;
}

message GetBucketFilesWithContentChunk {
  repeated FileContent files = 1;
}

message GetBucketFilesAsZipRequest {
  string bucket_id = 1;
  string prefix = 2; // Optional filter
}

message GetBucketFilesAsZipResponse {
  string download_url = 1;
  int64 expires_at = 2;
}

message GetBucketFilesAsZipChunk {
  bytes content = 1;
}

message ExportBucketFilesAsZipToUploadRequest {
  string bucket_id = 1;
  string prefix = 2; // Optional filter

  string upload_url = 3;
  string upload_bucket = 4;
  string upload_key = 5;
  string content_type = 6; // Optional, defaults to application/zip
  map<string, string> upload_headers = 7; // Sent with upload_url requests, as returned by the signer
}

message ExportBucketFilesAsZipToUploadResponse {
  int64 byte_size = 1;
  string sha256 = 2;
  int64 file_count = 3;
}

message SetBucketFilesRequest {
  string bucket_id = 1;
  repeated FileContentsBase files = 2;
}

message SetBucketFilesResponse {}

message SetBucketFileRequest {
  string bucket_id = 1;
  string path = 2;
  bytes content = 3;
}

message SetBucketFileResponse {}

message CopyBucketFileSource {
  string path = 1;
  string source_bucket = 2;
  string source_key = 3;
}

message CopyBucketFilesRequest {
  string bucket_id = 1;
  repeated CopyBucketFileSource files = 2;
}

message CopyBucketFilesResponse {
  repeated string copied_paths = 1;
}

message DeleteBucketFileRequest {
  string bucket_id = 1;
  string path = 2;
}

message DeleteBucketFileResponse {}

message DeleteBucketPathRequest {
  string bucket_id = 1;
  string path = 2;
}

message DeleteBucketPathResponse {
  repeated string deleted_paths = 1;
}

message PruneBucketPathRequest {
  string bucket_id = 1;
  string prefix = 2;
  repeated string keep_paths = 3;
  repeated string exclude_prefixes = 4;
}

message PruneBucketPathResponse {
  repeated string deleted_paths = 1;
}

message ExportBucketToGithubRequest {
  string bucket_id = 1;
  string owner = 2;
  string repo = 3;
  string path = 4;
  string token = 5;
  string branch = 6;
  string commit_message = 7;
  repeated string delete_paths = 8;
  bool explicit_deletes_only = 9;

  // Files at or above this size are routed through Git LFS.
  // Zero or negative means use the service default.
  int64 lfs_threshold_bytes = 10;
  string github_api_url = 11;
  string github_lfs_endpoint = 12;

  // When set, bucket_id, delete_paths and explicit_deletes_only are ignored.
  ManifestSource manifest = 20;
}

message ExportBucketToGithubResponse {
  ExportStats stats = 10;
  uint32 commits_created = 11;
  // The slice deadline or write budget ended before all work was done.
  bool partial = 12;
  RemoteStateCache new_remote_state = 13;
  int64 retry_after_unix = 14;
  // The branch head this call started from, the last commit it created (empty if none),
  // and whether the head moved to a commit it didn't create while it ran.
  string start_head_sha = 15;
  string last_commit_sha = 16;
  bool foreign_commits = 17;
  // Content-creating requests charged against write_budget, failed attempts included.
  uint32 write_requests = 18;
}

message CreateBucketFromGitlabRequest {
  string new_bucket_id = 1;
  int64 project_id = 2;
  string path = 3;
  string ref = 4;
  string token = 5;
  string gitlab_api_url = 6;
}

message ExportBucketToGitlabRequest {
  string bucket_id = 1;
  int64 project_id = 2;
  string path = 3;
  string token = 4;
  string gitlab_api_url = 5;
  string branch = 6;
  string commit_message = 7;
  repeated string delete_paths = 8;
  bool explicit_deletes_only = 9;

  // Files at or above this size are routed through Git LFS; zero or negative leaves LFS
  // to the files over the transport's own file size cap.
  int64 lfs_threshold_bytes = 10;

  // When set, bucket_id, delete_paths and explicit_deletes_only are ignored.
  ManifestSource manifest = 20;
}

message ExportBucketToGitlabResponse {
  ExportStats stats = 10;
  uint32 commits_created = 11;
  // The slice deadline or write budget ended before all work was done.
  bool partial = 12;
  RemoteStateCache new_remote_state = 13;
  int64 retry_after_unix = 14;
  // The branch head this call started from, the last commit it created (empty if none),
  // and whether the head moved to a commit it didn't create while it ran.
  string start_head_sha = 15;
  string last_commit_sha = 16;
  bool foreign_commits = 17;
  // Content-creating requests charged against write_budget, failed attempts included.
  uint32 write_requests = 18;
}

message CreateBucketFromBitbucketCloudRequest {
  string new_bucket_id = 1;
  string workspace = 2;
  string repo = 3;
  string path = 4;
  string ref = 5;
  string token = 6;
  string bitbucket_web_url = 7;
}

message CreateBucketFromBitbucketDataCenterRequest {
  string new_bucket_id = 1;
  string clone_url = 2;
  string path = 3;
  string ref = 4;
  string username = 5;
  string token = 6;
}

message ExportBucketToBitbucketCloudRequest {
  string bucket_id = 1;
  string workspace = 2;
  string repo = 3;
  string path = 4;
  string branch = 5;
  string commit_message = 6;
  string token = 7;
  string bitbucket_api_url = 8;
  string bitbucket_web_url = 9;
  repeated string delete_paths = 10;
  bool explicit_deletes_only = 11;

  // Files at or above this size are routed through Git LFS; zero or negative leaves LFS
  // to the files over the transport's own file size cap.
  int64 lfs_threshold_bytes = 12;

  // When set, bucket_id, delete_paths and explicit_deletes_only are ignored.
  ManifestSource manifest = 20;
}

message ExportBucketToBitbucketDataCenterRequest {
  string bucket_id = 1;
  string clone_url = 2;
  string path = 3;
  string branch = 4;
  string commit_message = 5;
  string username = 6;
  string token = 7;
  repeated string delete_paths = 8;
  bool explicit_deletes_only = 9;

  // Files at or above this size are routed through Git LFS; zero or negative leaves LFS
  // to the files over the transport's own file size cap.
  int64 lfs_threshold_bytes = 10;

  // When set, bucket_id, delete_paths and explicit_deletes_only are ignored.
  ManifestSource manifest = 20;
}

message ExportBucketToBitbucketResponse {
  ExportStats stats = 10;
  uint32 commits_created = 11;
  // The slice deadline or write budget ended before all work was done.
  bool partial = 12;
  RemoteStateCache new_remote_state = 13;
  int64 retry_after_unix = 14;
  // The branch head this call started from, the last commit it created (empty if none),
  // and whether the head moved to a commit it didn't create while it ran.
  string start_head_sha = 15;
  string last_commit_sha = 16;
  bool foreign_commits = 17;
  // Content-creating requests charged against write_budget, failed attempts included.
  uint32 write_requests = 18;
}

message ManifestSource {
  string bucket = 1;
  string key = 2;
  string sha256 = 3;
  string previous_bucket = 4;
  string previous_key = 5;
  string previous_sha256 = 6;
  uint32 max_unexpected_deletes = 7;
  double max_unexpected_delete_ratio = 8;
  bool allow_mass_delete = 9;
  // Content-creating provider requests allowed in this invocation. Zero means no limit.
  uint32 write_budget = 10;
  // Wall-clock budget for this invocation. Zero means the service default.
  uint32 slice_seconds = 11;
  RemoteStateCache remote_state = 12;
  ExportTuning tuning = 13;
  // Prefix (in the code-bucket service's own bucket) for new remote-state listings,
  // e.g. "remote-state/<repoId>/". Empty disables writing listings.
  string remote_state_key_prefix = 14;
}

message RemoteStateCache {
  string commit_sha = 1;
  string tree_sha = 2;
  string listing_bucket = 3;
  string listing_key = 4;
  uint32 entry_count = 5;
}

// Zero values mean the service default.
message ExportTuning {
  uint64 graphql_max_file_bytes = 1;
  uint64 rest_max_blob_bytes = 2;
  uint64 batch_initial_bytes = 3;
  uint64 batch_max_bytes = 4;
}

message ExportStats {
  uint32 files_total = 1;
  uint32 files_uploaded = 2;
  uint32 files_skipped = 3;
  uint32 blobs_created = 4;
  uint32 blobs_reused = 5;
  uint32 lfs_uploaded = 6;
  uint64 bytes_uploaded = 7;
  uint32 deleted = 8;
  uint32 unexpected_deletes = 9;
  uint32 github_requests = 10;
  uint64 rate_limit_wait_ms = 11;
  uint32 commits_created = 12;
  uint32 batch_size_reductions = 13;
}

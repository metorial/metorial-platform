[package]
name = "metorial-control"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Metorial development environment control CLI"

[[bin]]
name = "control"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
console = "0.15"
indicatif = "0.17"
miette = { version = "7", features = ["fancy"] }
percent-encoding = "2.3.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "time"] }
toml = "0.8"
walkdir = "2"

[dev-dependencies]
pretty_assertions = "1"
tempfile = "3.27.0"

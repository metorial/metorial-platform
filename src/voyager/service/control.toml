name = "@metorial/voyager"
group = "oss"

[dev]
run = ["bun --watch ./src/server.ts"]

[[dev.expose]]
port = 52060

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
REDIS_URL = "redis://localhost:{{CONTROL_PORT_REDIS}}/0"

[dev.db.main]
name = "voyager"
engine = "postgres"
env = "DATABASE_URL"

[dev.db.search]
name = "voyager-search"
engine = "postgres"
env = "SEARCH_DATABASE_URL"

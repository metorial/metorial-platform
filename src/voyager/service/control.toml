name = "@metorial/voyager"
group = "oss"

[test.e2e]
start = ["bun ./src/server.ts"]

[dev]
run = ["bun --watch ./src/server.ts"]

[endpoints.rpc]
port = 52060
env = [{ key = "VOYAGER_PORT", value = "{{PORT}}" }]

[[resources]]
type = "redis"
env = [{ key = "REDIS_URL", value = "redis://{{HOSTNAME}}:{{PORT}}/0" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"

[dev.db.main]
name = "voyager"
engine = "postgres"
env = "DATABASE_URL"

[dev.db.search]
name = "voyager-search"
engine = "postgres"
env = "SEARCH_DATABASE_URL"

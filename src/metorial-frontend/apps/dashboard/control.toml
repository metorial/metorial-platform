name = "@metorial/app-dashboard"
group = "oss"
mode = "oss"

[[dependencies]]
identifier = "@metorial/app-api"
env = [
  { endpoint = "portal", key = "VITE_CUSTOM_PORTAL_API_URL", value = "http://{{HOSTNAME}}:{{PORT}}/portal-api" },
]

[dev]
run = ["dev:start"]

[endpoints.web]
port = 3300
env = [{ key = "PORT", value = "{{BIND_PORT}}" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
VITE_METORIAL_ENV = "development"
VITE_EXPLORER_URL = "http://{{HOSTNAME}}:6050"
VITE_EXPLORER_V2_URL = "http://{{HOSTNAME}}:4350"
VITE_FEDERATION_INSTANCES = "{\"default\":{\"federationApi\":\"http://{{HOSTNAME}}:4321\",\"coreApi\":\"http://{{HOSTNAME}}:4310?_metorial_instance=default\",\"adminApi\":\"http://{{HOSTNAME}}:4322/metorial-admin\",\"horizon\":true},\"local2\":{\"federationApi\":\"http://{{HOSTNAME}}:4321\",\"coreApi\":\"http://{{HOSTNAME}}:4310?_metorial_instance=local2\",\"adminApi\":\"http://{{HOSTNAME}}:4322/metorial-admin\",\"horizon\":true}}"
VITE_SHELL_URL = "http://{{HOSTNAME}}:4333"
VITE_API_EXPLORER_URL = "http://{{HOSTNAME}}:4351"

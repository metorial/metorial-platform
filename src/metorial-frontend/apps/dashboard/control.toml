name = "@metorial/app-dashboard"
group = "oss"
mode = "oss"

[[dependencies]]
identifier = "@metorial/app-api"
env = [
  { endpoint = "portal", key = "VITE_CUSTOM_PORTAL_API_URL", value = "http://{{HOSTNAME}}:{{PORT}}/portal-api" },
]

[test.e2e]
start = ["vite --port \"$PORT\" --host 0.0.0.0"]
packages = []

[dev]
run = ["vite --port \"$PORT\" --host 0.0.0.0"]

[endpoints.web]
port = 3300
env = [{ key = "PORT", value = "{{PORT}}" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
VITE_METORIAL_ENV = "development"
VITE_EXPLORER_URL = "http://{{HOSTNAME}}:6050"
VITE_EXPLORER_V2_URL = "http://{{HOSTNAME}}:4350"

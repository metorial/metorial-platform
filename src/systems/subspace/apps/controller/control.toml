[control]
name = "subspace-controller"

[service]
port = 52070
dockerfile = "src/systems/subspace/apps/controller/dev.Dockerfile"
build_context = "oss"

[test.e2e]
command = "set -a && . ./.env.ci && set +a && bun run test:ci"
setup = [
  "bunx prisma db push --schema ../../db/prisma/schema --config ../../db/prisma.config.ts",
  "bunx prisma generate --schema ../../db/prisma/schema --config ../../db/prisma.config.ts"
]
cwd = "/app/src/systems/subspace/apps/controller"
runner = "sidecar"

[env]
DATABASE_URL = "postgresql://postgres:postgres@$deps.postgres.5432/subspace-test"
PUBLIC_SERVICE_URL = "http://subspace-public:52071"
REDIS_URL = "redis://$deps.redis.6379/0"
NATS_URL = "nats://$deps.nats.4222"
SLATES_HUB_URL = "http://$deps.slates-hub.52046/slates-hub"
SLATES_HUB_PUBLIC_URL = "http://$deps.slates-hub.52045"
SHUTTLE_URL = "http://$deps.shuttle.52080/metorial-shuttle"
SHUTTLE_LIVE_URL = "http://$deps.shuttle.52080"
SHUTTLE_PUBLIC_URL = "http://$deps.shuttle.52081"
TEST_MCP_SERVER_BASE_URL = "http://$deps.mcp-test-server.52198"
VOYAGER_URL = "http://$deps.voyager.52060/metorial-voyager"
ORIGIN_URL = "http://origin:52090/metorial-origin"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
MESSAGE_BUCKET_NAME = "subspace-messages-test"
METORIAL_ENV = "development"
CARGO_API_URL = "http://$deps.cargo.52150/metorial-cargo"

[[deps]]
name = "postgres"
preset = "postgres"
init = "../../init-test-db.sh"

[deps.env]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "postgres"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "nats"
preset = "nats"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "voyager"
mock = "voyager"

[[deps]]

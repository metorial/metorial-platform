[control]
name = "subspace-controller"

[service]
port = 52070
dockerfile = "src/systems/subspace/apps/controller/Dockerfile"
build_context = "oss"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "set -a && . ./.env.ci && set +a && bun run test:ci"
setup = [
  "bunx prisma db push --schema ../../db/prisma/schema --config ../../db/prisma.config.ts",
  "bunx prisma generate --schema ../../db/prisma/schema --config ../../db/prisma.config.ts"
]
cwd = "/app/src/systems/subspace/apps/controller"
runner = "sidecar"

[[databases]]
adapter = "postgres"
name = "subspace"

[[databases]]
adapter = "postgres"
name = "subspace-test"

[env]
DATABASE_URL = "$db.subspace-test.url"
PUBLIC_SERVICE_URL = "http://subspace-public:52071"
REDIS_URL = "redis://$deps.redis.6379/0"
NATS_URL = "nats://$deps.nats.4222"
SLATES_HUB_URL = "http://$deps.slates-hub.52046/slates-hub"
SLATES_HUB_PUBLIC_URL = "http://$deps.slates-hub.52045"
SHUTTLE_URL = "http://$deps.shuttle.52080/metorial-shuttle"
SHUTTLE_LIVE_URL = "http://$deps.shuttle.52080"
SHUTTLE_PUBLIC_URL = "http://$deps.shuttle.52081"
TEST_MCP_SERVER_BASE_URL = "http://$deps.mcp-test-server.52198"
VOYAGER_URL = "http://$deps.voyager.52060/metorial-voyager"
ORIGIN_URL = "http://origin:52090/metorial-origin"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
MESSAGE_BUCKET_NAME = "subspace-messages-test"
METORIAL_ENV = "development"
CARGO_API_URL = "http://$deps.cargo.52150/metorial-cargo"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "postgres"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "nats"
preset = "nats"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "voyager"
mock = "voyager"

[[deps]]
name = "forge"
control = "../../../forge/service"
scope = "service"

[[deps]]
name = "function-bay"
control = "../../../function-bay/service"
scope = "service"

[[deps]]
name = "signal"
control = "../../../signal/service"
scope = "service"

[[deps]]
name = "slates-registry"
control = "../../../slates/apps/registry"
scope = "service"

[[deps]]
name = "slates-hub"
control = "../../../slates/apps/hub"
scope = "service"

[[deps]]
name = "shuttle"
control = "../../../shuttle/service"
scope = "service"

[deps.env]
SHUTTLE_UNSAFE_SSRF_BYPASS = "true"

[[deps]]
name = "cargo"
control = "../../../cargo/service"
scope = "service"

[deps.env]
API_URL = "http://$deps.cargo.52150/metorial-cargo"
ORIGIN_URL = "http://$deps.origin.52090/metorial-origin"
CODE_BUCKET_SERVICE_URL = "code-bucket:5050"

[[deps]]
name = "code-bucket"
control = "../../../origin/apps/code-bucket"
scope = "service"

[[deps]]
name = "origin"
control = "../../../origin/apps/service"
scope = "service"

[[deps]]
name = "subspace-worker"
control = "../worker"
scope = "service"

[deps.env]
DATABASE_URL = "$db.subspace-test.url"
PUBLIC_SERVICE_URL = "http://subspace-public:52071"
REDIS_URL = "redis://$deps.redis.6379/0"
NATS_URL = "nats://$deps.nats.4222"
SLATES_HUB_URL = "http://$deps.slates-hub.52046/slates-hub"
SLATES_HUB_PUBLIC_URL = "http://$deps.slates-hub.52045"
SHUTTLE_URL = "http://$deps.shuttle.52080/metorial-shuttle"
SHUTTLE_LIVE_URL = "http://$deps.shuttle.52080"
SHUTTLE_PUBLIC_URL = "http://$deps.shuttle.52081"
VOYAGER_URL = "http://$deps.voyager.52060/metorial-voyager"
ORIGIN_URL = "http://origin:52090/metorial-origin"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
MESSAGE_BUCKET_NAME = "subspace-messages-test"
METORIAL_ENV = "development"
WORKER_HEALTH_PORT = "12121"
CARGO_API_URL = "http://$deps.cargo.52150/metorial-cargo"

[[deps]]
name = "mcp-test-server"
inline = { build = { context = "oss", dockerfile = "src/systems/subspace/apps/controller/Dockerfile", target = "workspace" }, command = ["sh", "-c", "PORT=52198 bun /app/src/systems/subspace/test-servers/index.ts"], port = 52198, health = { cmd = "bun -e \"fetch('http://localhost:52198/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" } }

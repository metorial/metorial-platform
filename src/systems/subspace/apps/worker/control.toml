[control]
name = "subspace-worker"

[service]
dockerfile = "src/systems/subspace/apps/worker/Dockerfile"
build_context = "oss"
health = { cmd = "curl -f http://localhost:12121/ || exit 1" }

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial-subspace/app-worker"
target = "server:build"
dockerfile = "Dockerfile"
extra_paths = ["//oss/src/systems/_shared/entityImage.ts"]

[[build.automations]]
name = "subspace-worker-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial-subspace/db", "@metorial/slates", "@metorial/forge", "@metorial/function-bay", "@metorial/signal", "@metorial/synthesis", "@metorial-cargo/service"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "../../db", to = "/app/db" },
  { from = "/app/node_modules", to = "/app/node_modules" }
]

[build.runtime]
base_image = "oven/bun:1.2-alpine"
packages = ["curl"]
env = { NODE_ENV = "production" }
command = "cd db && bun prisma db push --accept-data-loss && cd /app && bun dist/index.js"
healthcheck = "curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = [
  "bunx prisma db push --schema ../../db/prisma/schema --config ../../db/prisma.config.ts",
  "bunx prisma generate --schema ../../db/prisma/schema --config ../../db/prisma.config.ts"
]
cwd = "/app/src/systems/subspace/apps/worker"
runner = "service"

[[databases]]
adapter = "postgres"
name = "subspace-test"

[env]
DATABASE_URL = "$db.subspace-test.url"
PUBLIC_SERVICE_URL = "http://subspace-public:52071"
REDIS_URL = "redis://$deps.redis.6379/0"
WORKER_HEALTH_PORT = "12121"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "postgres"

[[deps]]
name = "redis"
preset = "redis"

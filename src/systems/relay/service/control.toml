[control]
name = "relay"

[service]
port = 52110
dockerfile = "src/systems/relay/service/Dockerfile.generated"
build_context = "oss"
health = { cmd = "bun -e \"fetch('http://localhost:12121/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"" }

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial/relay"
target = "server:build"
dockerfile = "Dockerfile.generated"

[[build.automations]]
name = "relay-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial/relay"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "prisma", to = "/app/prisma" },
  { from = "prisma.config.ts", to = "/app/prisma.config.ts" },
  { from = "/app/node_modules", to = "/app/node_modules" }
]

[build.runtime]
base_image = "oven/bun:1.2-alpine"
packages = ["curl"]
env = { NODE_ENV = "production" }
expose = [52110]
command = "bun prisma db push --accept-data-loss && bun /app/dist/index.js"
healthcheck = "curl -f http://localhost:52110/metorial-relay && curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/src/systems/relay/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "relay-test"

[env]
DATABASE_URL = "$db.relay-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "relay"
POSTGRES_PASSWORD = "relay"
POSTGRES_DB = "relay"

[[deps]]
name = "redis"
preset = "redis"

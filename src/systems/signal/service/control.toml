[control]
name = "signal"

[service]
port = 52050
dockerfile = "dev.Dockerfile"
build_context = "."

[test.e2e]
command = "bun run test"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/service"
runner = "service"

[env]
DATABASE_URL = "postgresql://signal:signal@$deps.postgres.5432/signal-test"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
LOGS_BUCKET_NAME = "bundles-test"

[[deps]]
name = "postgres"
preset = "postgres"
init = "init-test-db.sh"

[deps.env]
POSTGRES_USER = "signal"
POSTGRES_PASSWORD = "signal"
POSTGRES_DB = "signal"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

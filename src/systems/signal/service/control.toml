[control]
name = "signal"

[service]
port = 52050
dockerfile = "src/systems/signal/service/Dockerfile"
build_context = "oss"

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial/signal"
target = "server:build"
dockerfile = "Dockerfile"

[[build.automations]]
name = "signal-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial/signal"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "prisma", to = "/app/prisma" },
  { from = "prisma.config.ts", to = "/app/prisma.config.ts" }
]

[build.runtime]
base_image = "oven/bun:1.2.22-alpine"
packages = ["curl"]
env = { NODE_ENV = "production" }
expose = [52030]
command = "bun prisma db push --accept-data-loss && bun /app/dist/index.js"
healthcheck = "curl -f http://localhost:52050/ping && curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e:ci"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/src/systems/signal/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "signal-test"

[env]
DATABASE_URL = "$db.signal-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
LOGS_BUCKET_NAME = "bundles-test"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "signal"
POSTGRES_PASSWORD = "signal"
POSTGRES_DB = "signal"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[control]
name = "signal"

[service]
port = 52050
dockerfile = "src/systems/signal/service/Dockerfile"
build_context = "oss"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/src/systems/signal/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "signal-test"

[env]
DATABASE_URL = "$db.signal-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
LOGS_BUCKET_NAME = "bundles-test"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "signal"
POSTGRES_PASSWORD = "signal"
POSTGRES_DB = "signal"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

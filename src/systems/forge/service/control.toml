[control]
name = "forge"

[service]
port = 52020
dockerfile = "src/systems/forge/service/Dockerfile"
build_context = "oss"

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial/forge"
target = "server:build"
dockerfile = "Dockerfile"

[[build.automations]]
name = "forge-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial/forge"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "prisma", to = "/app/prisma" },
  { from = "prisma.config.ts", to = "/app/prisma.config.ts" },
  { from = "/app/node_modules", to = "/app/node_modules" }
]

[build.runtime]
base_image = "oven/bun:1.2.22-alpine"
packages = ["curl"]
env = { NODE_ENV = "development" }
expose = [52020]
command = "bun prisma db push --accept-data-loss && bun /app/dist/index.js"
healthcheck = "curl -f http://localhost:52020/ping && curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/src/systems/forge/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "forge-test"

[env]
DATABASE_URL = "$db.forge-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
ARTIFACT_BUCKET_NAME = "artifacts-test"
LOG_BUCKET_NAME = "logs-test"
ENCRYPTION_KEY = "test-encryption-key-32-bytes!!"
DEFAULT_PROVIDER = "local"
CODE_BUILD_AWS_REGION = "us-east-1"
NODE_ENV = "development"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "forge"
POSTGRES_PASSWORD = "forge"
POSTGRES_DB = "forge"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[control]
name = "slates-registry"

[service]
port = 52040
dockerfile = "src/systems/slates/apps/registry/Dockerfile"
build_context = "oss"
health = { path = "/ping" }

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial/slates-registry"
target = "server:build"
dockerfile = "Dockerfile"

[[build.automations]]
name = "slates-registry-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial/slates-registry"]

[[build.automations]]
name = "slates-registry-admin"
kind = "run-targets"
target = "admin:build"
projects = ["@metorial/slates-registry"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "dist/admin", to = "/app/dist/admin" },
  { from = "prisma", to = "/app/prisma" },
  { from = "/app/node_modules", to = "/app/node_modules" }
]

[build.runtime]
base_image = "oven/bun:1.2-alpine"
packages = ["curl"]
env = { NODE_ENV = "production" }
expose = [52040, 52041, 52042]
command = "bun prisma db push --schema prisma/schema.prisma --accept-data-loss && bun /app/dist/index.js"
healthcheck = "curl -f http://localhost:52040/ping && curl -f http://localhost:52041/ping && curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = ["bun prisma generate --schema prisma/schema.prisma", "bun prisma db push --schema prisma/schema.prisma --accept-data-loss"]
cwd = "/app/src/systems/slates/apps/registry"
runner = "service"

[[databases]]
adapter = "postgres"
name = "slates-registry-test"

[env]
DATABASE_URL = "$db.slates-registry-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
PACKAGE_BUCKET_NAME = "slates-registry-packages-test"
SERVICE_PUBLIC_URL = "http://slates-registry:52040"
PUBLIC_ACCESS_PERMITTED = "true"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "slates-registry"
POSTGRES_PASSWORD = "slates-registry"
POSTGRES_DB = "slates-registry"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

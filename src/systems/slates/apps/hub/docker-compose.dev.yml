services:
  postgres:
    image: postgres:16-alpine
    container_name: slates-hub-postgres
    restart: unless-stopped
    ports:
      - '65432:5432'
    environment:
      POSTGRES_USER: slates-hub
      POSTGRES_PASSWORD: slates-hub
      POSTGRES_DB: slates-hub
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U slates-hub']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  redis:
    image: redis:7-alpine
    container_name: slates-hub-redis
    restart: unless-stopped
    ports:
      - '65379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  object-storage:
    profiles: ['infra']
    image: ghcr.io/metorial/object-storage:latest
    container_name: slates-hub-object-storage
    restart: unless-stopped
    ports:
      - '65010:52010'
    volumes:
      - object-store-data:/app/data
    environment:
      RUST_LOG: info
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${OBJECT_STORAGE_AWS_REGION:-us-east-1}
      OBJECT_STORE__SERVER__HOST: 0.0.0.0
      OBJECT_STORE__SERVER__PORT: 52010
      OBJECT_STORE__BACKEND__TYPE: ${OBJECT_STORAGE_BACKEND_TYPE:-local}
      OBJECT_STORE__BACKEND__ROOT_PATH: ${OBJECT_STORAGE_BACKEND_ROOT_PATH:-/app/data}
      OBJECT_STORE__BACKEND__REGION: ${OBJECT_STORAGE_AWS_REGION:-us-east-1}
      OBJECT_STORE__BACKEND__PHYSICAL_BUCKET: ${OBJECT_STORAGE_AWS_S3_BUCKET:-slates-hub-ci}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:52010/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  forge:
    profiles: ['infra']
    image: ghcr.io/metorial/forge:latest
    container_name: slates-hub-forge
    restart: unless-stopped
    ports:
      - '65020:52020'
    environment:
      DATABASE_URL: postgresql://slates-hub:slates-hub@postgres:5432/forge
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEFAULT_PROVIDER: aws.code-build
      OBJECT_STORAGE_URL: http://object-storage:52010
      LOG_BUCKET_NAME: logs
      ARTIFACT_BUCKET_NAME: artifacts
      CODE_BUILD_AWS_REGION: ${CODE_BUILD_AWS_REGION:-us-east-1}
      CODE_BUILD_AWS_ACCESS_KEY_ID: ${CODE_BUILD_AWS_ACCESS_KEY_ID:-test}
      CODE_BUILD_AWS_SECRET_ACCESS_KEY: ${CODE_BUILD_AWS_SECRET_ACCESS_KEY:-test}
      CODE_BUILD_PROJECT_NAME: ${CODE_BUILD_PROJECT_NAME:-}
      CODE_BUILD_ROLE_ARN: ${CODE_BUILD_ROLE_ARN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:52020/ > /dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  function-bay:
    profiles: ['infra']
    image: ghcr.io/metorial/function-bay:latest
    container_name: slates-hub-function-bay
    restart: unless-stopped
    ports:
      - '65030:52030'
    environment:
      DATABASE_URL: postgresql://slates-hub:slates-hub@postgres:5432/function-bay
      REDIS_URL: redis://redis:6379/0
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      DEFAULT_PROVIDER: ${DEFAULT_PROVIDER:-aws.lambda}
      OBJECT_STORAGE_URL: http://object-storage:52010
      BUNDLE_BUCKET_NAME: bundles
      FORGE_API_URL: http://forge:52020/metorial-forge
      LAMBDA_AWS_REGION: ${LAMBDA_AWS_REGION:-us-east-1}
      LAMBDA_AWS_ACCESS_KEY_ID: ${LAMBDA_AWS_ACCESS_KEY_ID:-test}
      LAMBDA_AWS_SECRET_ACCESS_KEY: ${LAMBDA_AWS_SECRET_ACCESS_KEY:-test}
      LAMBDA_ROLE_ARN: ${LAMBDA_ROLE_ARN:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      forge:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:52030/ > /dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  signal:
    profiles: ['infra']
    image: ghcr.io/metorial/signal:latest
    container_name: slates-hub-signal
    restart: unless-stopped
    ports:
      - '65050:52050'
    environment:
      DATABASE_URL: postgresql://slates-hub:slates-hub@postgres:5432/signal
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_URL: http://object-storage:52010
      LOGS_BUCKET_NAME: bundles
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:52050/ > /dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  slates-registry:
    profiles: ['infra']
    build:
      context: ../../../../..
      dockerfile: ./src/systems/slates/apps/registry/dev.Dockerfile
    container_name: slates-hub-registry
    restart: unless-stopped
    ports:
      - '65040:52040'
      - '65041:52041'
      - '65042:52042'
    environment:
      DATABASE_URL: postgresql://slates-hub:slates-hub@postgres:5432/slates-registry
      REDIS_URL: redis://redis:6379/0
      OBJECT_STORAGE_URL: http://object-storage:52010
      PACKAGE_BUCKET_NAME: slates-hub-packages
      SERVICE_PUBLIC_URL: http://localhost:65040
      PUBLIC_ACCESS_PERMITTED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "bun -e \"fetch('http://localhost:52040/ping').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - slates-hub-network

  slates-hub:
    profiles: ['hub']
    build:
      context: ../../../../..
      dockerfile: ./src/systems/slates/apps/hub/dev.Dockerfile
    container_name: slates-hub-service
    restart: unless-stopped
    ports:
      - '65045:52045'
      - '65046:52046'
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      METORIAL_ENV: ${METORIAL_ENV:-development}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      FUNCTION_BAY_API_URL: ${FUNCTION_BAY_API_URL}
      FUNCTION_BAY_TENANT_IDENTIFIER: ${FUNCTION_BAY_TENANT_IDENTIFIER}
      FUNCTION_BAY_DEFAULT_MEMORY_MB: ${FUNCTION_BAY_DEFAULT_MEMORY_MB}
      FUNCTION_BAY_DEFAULT_TIMEOUT_SECONDS: ${FUNCTION_BAY_DEFAULT_TIMEOUT_SECONDS}
      OBJECT_STORAGE_URL: ${OBJECT_STORAGE_URL}
      INVOCATIONS_BUCKET_NAME: ${INVOCATIONS_BUCKET_NAME}
      INITIAL_REGISTRIES: ${INITIAL_REGISTRIES}
      SUPPORTS_PREBUILT_SLATES: ${SUPPORTS_PREBUILT_SLATES:-false}
      SIGNAL_API_URL: ${SIGNAL_API_URL}
      SIGNAL_SENDER_IDENTIFIER: ${SIGNAL_SENDER_IDENTIFIER}
      SLATES_HUB_INSTANCE_IDENTIFIER: ${SLATES_HUB_INSTANCE_IDENTIFIER}
      SERVICE_PUBLIC_URL: ${SERVICE_PUBLIC_URL}
      NEBULA_API_URL: ${NEBULA_API_URL}
      NEBULA_CONSUMER_IDENTIFIER: ${NEBULA_CONSUMER_IDENTIFIER}
      NEBULA_CONSUMER_TOKEN: ${NEBULA_CONSUMER_TOKEN}
      SLATES_DELEGATE_SECRETS_TO_NEBULA: ${SLATES_DELEGATE_SECRETS_TO_NEBULA:-false}
    volumes:
      - ./src:/app/src/systems/slates/apps/hub/src:ro
      - ./admin:/app/src/systems/slates/apps/hub/admin:ro
      - ./package.json:/app/src/systems/slates/apps/hub/package.json:ro
      - ./tsconfig.json:/app/src/systems/slates/apps/hub/tsconfig.json:ro
      - ./prisma:/app/src/systems/slates/apps/hub/prisma
      - ./prisma.config.ts:/app/src/systems/slates/apps/hub/prisma.config.ts:ro
      - ../../packages:/app/src/systems/slates/packages:ro
      - /app/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - slates-hub-network

  slates-hub-admin:
    profiles: ['admin']
    image: oven/bun:latest
    container_name: slates-hub-admin
    restart: unless-stopped
    working_dir: /app
    command: sh -c "bun install && cd apps/hub && bun vite --config admin/vite.docker.config.ts"
    ports:
      - '65047:52047'
    volumes:
      - ../../:/app
    networks:
      - slates-hub-network

  slates-registry-admin:
    profiles: ['admin']
    image: oven/bun:latest
    container_name: slates-registry-admin
    restart: unless-stopped
    working_dir: /app
    command: sh -c "bun install && cd apps/registry && bun vite --config admin/vite.docker.config.ts"
    ports:
      - '65043:52043'
    volumes:
      - ../../:/app
    networks:
      - slates-hub-network

volumes:
  postgres_data:
    driver: local
  object-store-data:
    driver: local

networks:
  slates-hub-network:
    driver: bridge

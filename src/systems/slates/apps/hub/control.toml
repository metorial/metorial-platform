[control]
name = "slates-hub"

[service]
port = 52045
dockerfile = "src/systems/slates/apps/hub/Dockerfile"
build_context = "oss"

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial/slates"
target = "server:build"
dockerfile = "Dockerfile"

[[build.automations]]
name = "slates-hub-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial/slates", "@metorial/forge", "@metorial/function-bay", "@metorial/signal", "@metorial/ares"]

[[build.automations]]
name = "slates-hub-admin"
kind = "run-targets"
target = "admin:build"
projects = ["@metorial/slates"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "dist/admin", to = "/app/dist/admin" },
  { from = "prisma", to = "/app/prisma" },
  { from = "prisma.config.ts", to = "/app/prisma.config.ts" },
  { from = "/app/node_modules", to = "/app/node_modules" }
]

[build.runtime]
base_image = "oven/bun:1.2.22-alpine"
packages = ["curl"]
env = { NODE_ENV = "production" }
expose = [52045, 52046, 52047]
command = "bun prisma db push --accept-data-loss && bun /app/dist/index.js"
healthcheck = "curl -f http://localhost:52045/ping && curl -f http://localhost:52046/ping && curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e:ci"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss --schema prisma/schema"]
cwd = "/app/src/systems/slates/apps/hub"
runner = "service"

[[databases]]
adapter = "postgres"
name = "slates-hub-test"

[env]
DATABASE_URL = "$db.slates-hub-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
METORIAL_ENV = "development"
ENCRYPTION_KEY = "sTrG+z8ewVo7JJsgmv39UL/YDdgxlHSVhVPJOV7Omdg"
FUNCTION_BAY_API_URL = "http://$deps.function-bay.52030/metorial-function-bay"
FUNCTION_BAY_TENANT_IDENTIFIER = "test-tenant"
FUNCTION_BAY_DEFAULT_MEMORY_MB = "512"
FUNCTION_BAY_DEFAULT_TIMEOUT_SECONDS = "15"
SIGNAL_API_URL = "http://$deps.signal.52050/metorial-signal"
SIGNAL_SENDER_IDENTIFIER = "test-slates-hub"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
INVOCATIONS_BUCKET_NAME = "test-invocations"
INITIAL_REGISTRIES = "http://$deps.slates-registry.52040"
SLATES_HUB_INSTANCE_IDENTIFIER = "test-slates-hub"
SERVICE_PUBLIC_URL = "http://slates-hub:52045"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "slates-hub"
POSTGRES_PASSWORD = "slates-hub"
POSTGRES_DB = "slates-hub"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "forge"
control = "../../../forge/service"
scope = "service"

[[deps]]
name = "function-bay"
control = "../../../function-bay/service"
scope = "service"

[[deps]]
name = "signal"
control = "../../../signal/service"
scope = "service"

[[deps]]
name = "slates-registry"
control = "../registry"
scope = "service"

name: Hub E2E Tests

on:
  push:
    branches: [main, feature/**]
    paths:
      - 'src/systems/slates/apps/hub/**'
      - 'src/systems/slates/apps/registry/**'
      - 'src/systems/slates/packages/**'
      - 'src/systems/slates/clients/**'
      - 'src/systems/_clients/slates/**'
      - 'src/systems/slates/.github/workflows/hub-e2e-tests.yml'
      - '.github/workflows/system-e2e-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/systems/slates/apps/hub/**'
      - 'src/systems/slates/apps/registry/**'
      - 'src/systems/slates/packages/**'
      - 'src/systems/slates/clients/**'
      - 'src/systems/_clients/slates/**'
      - 'src/systems/slates/.github/workflows/hub-e2e-tests.yml'
      - '.github/workflows/system-e2e-tests.yml'

jobs:
  e2e-tests:
    name: Run Hub E2E Tests
    uses: ./.github/workflows/system-e2e-tests.yml
    secrets: inherit
    with:
      service_directory: src/systems/slates/apps/hub
      compose_project_prefix: slates-hub-ci
      compose_profiles: 'hub infra'
      wait_mode: healthy
      wait_services: |
        slates-hub-postgres
        slates-hub-redis
        slates-hub-object-storage
        slates-hub-forge
        slates-hub-signal
        slates-hub-function-bay
        slates-hub-registry
      test_container: slates-hub-service
      test_command: cd /app/src/systems/slates/apps/hub && bun run test -- --mode ci

name: Hub E2E Tests

on:
  push:
    branches: [main, feature/**]
    paths:
      - 'apps/hub/**'
      - 'apps/registry/**'
      - 'packages/**'
      - 'clients/**'
      - '.github/workflows/hub-e2e-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/hub/**'
      - 'apps/registry/**'
      - 'packages/**'
      - 'clients/**'
      - '.github/workflows/hub-e2e-tests.yml'

jobs:
  e2e-tests:
    name: Run Hub E2E Tests
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    with:
      service_directory: apps/hub
      compose_project_prefix: slates-hub-ci
      compose_profiles: 'hub infra'
      wait_mode: healthy
      wait_services: |
        slates-hub-postgres
        slates-hub-redis
        slates-hub-object-storage
        slates-hub-forge
        slates-hub-signal
        slates-hub-function-bay
        slates-hub-registry
      test_container: slates-hub-service
      test_command: cd apps/hub && bun run test -- --mode ci

name: Build and Publish Registry

on:
  push:
    branches:
      - main
    paths:
      - 'src/systems/slates/apps/registry/**'
      - 'src/systems/slates/packages/**'
      - 'src/systems/slates/clients/**'
      - 'src/systems/_clients/slates/**'
      - 'src/systems/slates/.github/workflows/publish-registry.yml'
      - '.github/workflows/system-build-image.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'src/systems/slates/apps/registry/**'
      - 'src/systems/slates/packages/**'
      - 'src/systems/slates/clients/**'
      - 'src/systems/_clients/slates/**'
      - 'src/systems/slates/.github/workflows/publish-registry.yml'
      - '.github/workflows/system-build-image.yml'

jobs:
  build-and-publish-docker:
    uses: ./.github/workflows/system-build-image.yml
    secrets: inherit
    with:
      image_name: metorial/slates-registry
      docker_context: ./src/systems/slates/apps/registry
      dockerfile: ./src/systems/slates/apps/registry/Dockerfile

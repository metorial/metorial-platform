[control]
name = "function-bay"

[service]
port = 52030
dockerfile = "src/systems/function-bay/service/dev.Dockerfile"
build_context = "oss"

[test.e2e]
command = "bun run test"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/src/systems/function-bay/service"
runner = "service"

[env]
DATABASE_URL = "postgresql://postgres:postgres@$deps.postgres.5432/function-bay-test"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
BUNDLE_BUCKET_NAME = "bundles"
ENCRYPTION_KEY = "ci-encryption-key-32-bytes!!!!"
FORGE_API_URL = "http://$deps.forge.52020/metorial-forge"
DEFAULT_PROVIDER = "aws.lambda"
LAMBDA_AWS_REGION = "us-east-1"

[[deps]]
name = "postgres"
preset = "postgres"
init = "init-test-db.sh"

[deps.env]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "postgres"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "forge"
control = "../../forge/service"
scope = "service"

[deps.env]
DATABASE_URL = "postgresql://postgres:postgres@$deps.postgres.5432/forge"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
ARTIFACT_BUCKET_NAME = "artifacts-test"
LOG_BUCKET_NAME = "logs-test"
ENCRYPTION_KEY = "test-encryption-key-32-bytes!!"
DEFAULT_PROVIDER = "aws.code-build"
CODE_BUILD_AWS_REGION = "us-east-1"

[control]
name = "function-bay"

[service]
port = 52030
dockerfile = "src/systems/function-bay/service/Dockerfile"
build_context = "oss"

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial/function-bay"
target = "server:build"
dockerfile = "Dockerfile"

[[build.automations]]
name = "function-bay-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial/function-bay", "@metorial/forge"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "prisma", to = "/app/prisma" },
  { from = "prisma.config.ts", to = "/app/prisma.config.ts" },
  { from = "/app/node_modules", to = "/app/node_modules" }
]

[build.runtime]
base_image = "oven/bun:1.2-alpine"
packages = ["curl"]
env = { NODE_ENV = "development" }
expose = [52030]
command = "bun prisma db push --accept-data-loss && bun /app/dist/index.js"
healthcheck = "curl -f http://localhost:52030/ping && curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/src/systems/function-bay/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "function-bay-test"

[env]
DATABASE_URL = "$db.function-bay-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
BUNDLE_BUCKET_NAME = "bundles"
ENCRYPTION_KEY = "ci-encryption-key-32-bytes!!!!"
FORGE_API_URL = "http://$deps.forge.52020/metorial-forge"
DEFAULT_PROVIDER = "local"
LAMBDA_AWS_REGION = "us-east-1"
NODE_ENV = "development"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "postgres"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "forge"
control = "../../forge/service"
scope = "service"

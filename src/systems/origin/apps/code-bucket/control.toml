[control]
name = "code-bucket"

[service]
port = 52091
dockerfile = "src/systems/origin/apps/code-bucket/Dockerfile"
build_context = "oss"
health = { cmd = "nc -z localhost 52091" }

[build]
builder = "go"
mode = "generated"
context = "repo"
dockerfile = "Dockerfile"

[build.builder_image]
image = "oven/bun:1.2.22-alpine"

[build.install]
system_packages = ["go", "git", "ca-certificates", "nodejs"]

[[build.install.layers]]
name = "code-workspace"
tool = "bun"
cwd = "../code-workspace"
manifests = [
  "../code-workspace/package.json",
  "../code-workspace/extensions/memfs/package.json"
]
command = "bun install --linker=hoisted"

[build.manifests]
files = [
  "go.mod",
  "go.sum",
  "package.json"
]

[build.inputs]
paths = [
  "cmd/**",
  "gen/**",
  "internal/**",
  "pkg/**",
  "proto/**",
  "index.ts",
  "scripts/**",
  "ts-proto-gen/**",
  "../code-workspace/**"
]

[build.prebuild]
steps = [
  { cwd = "../code-workspace", run = "bunx tsc && bunx vite build" },
  { run = "rm -rf pkg/workspace/dist && mkdir -p pkg/workspace && cp -R ../code-workspace/dist pkg/workspace/dist" }
]

[build.main]
steps = [
  { run = "CGO_ENABLED=0 GOOS=linux go build -a -installsuffix cgo -o /tmp/code-bucket ./cmd/server" }
]

[build.artifacts]
copy = [
  { from = "/tmp/code-bucket", to = "/app/code-bucket" }
]

[build.runtime]
base_image = "alpine:latest"
packages = ["ca-certificates", "tzdata", "netcat-openbsd"]
expose = [52091, 52092, 5050]
command = "/app/code-bucket"
healthcheck = "nc -z localhost 52091 || exit 1"

[test.unit]
command = "go test ./..."
setup = [
  "cd ../code-workspace && bun install --linker=hoisted && bunx tsc && bunx vite build",
  "rm -rf pkg/workspace/dist && mkdir -p pkg/workspace && cp -R ../code-workspace/dist pkg/workspace/dist"
]
cwd = "/app/src/systems/origin/apps/code-bucket"

[test.e2e]
command = "go test ./pkg/util -run TestNormalizePath"
cwd = "."
runner = "service"

[env]
CODE_BUCKET_JWT_SECRET = "dev-secret-change-in-production"
CODE_BUCKET_OBJECT_STORAGE_BUCKET = "code-bucket"
CODE_BUCKET_OBJECT_STORAGE_ENDPOINT = "http://$deps.object-store.52010"
CODE_BUCKET_REDIS_URL = "redis://$deps.redis.6379"
CODE_BUCKET_HTTP_ADDRESS = ":52091"
CODE_BUCKET_WORKSPACE_ADDRESS = ":52092"
CODE_BUCKET_RPC_ADDRESS = ":5050"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

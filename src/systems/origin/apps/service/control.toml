[control]
name = "origin"

[service]
port = 52090
dockerfile = "src/systems/origin/apps/service/Dockerfile"
build_context = "oss"
health = { path = "/ping" }

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial/origin"
target = "server:build"
dockerfile = "Dockerfile"

[[build.automations]]
name = "origin-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial/origin"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "prisma", to = "/app/prisma" },
  { from = "prisma.config.ts", to = "/app/prisma.config.ts" },
  { from = "/app/node_modules", to = "/app/node_modules" }
]

[build.runtime]
base_image = "oven/bun:1.2.22-alpine"
packages = ["curl"]
env = { NODE_ENV = "production" }
expose = [52090, 52093]
command = "bun prisma db push --accept-data-loss && bun /app/dist/index.js"
healthcheck = "curl -f http://localhost:52090/ping && curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/src/systems/origin/apps/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "origin-test"

[[databases]]
adapter = "postgres"
name = "origin"

[env]
DATABASE_URL = "$db.origin-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
ORIGIN_SERVICE_PUBLIC_URL = "http://origin:52093"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
CODE_BUCKET_OBJECT_STORAGE_BUCKET = "code-bucket"
CODE_BUCKET_SERVICE_URL = "code-bucket:5050"
CODE_BUCKET_EDITOR_URL = "http://code-bucket:52092"
CODE_BUCKET_EDITOR_API_URL = "http://code-bucket:52091"
SCM_GITHUB_APP_ID = "test-github-app-id"
SCM_GITHUB_APP_SLUG = "test-github-app"
SCM_GITHUB_APP_CLIENT_ID = "test-github-client-id"
SCM_GITHUB_APP_CLIENT_SECRET = "test-github-client-secret"
SCM_GITHUB_APP_PRIVATE_KEY_BASE_64 = "dGVzdC1wcml2YXRlLWtleQ=="

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "origin"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "code-bucket"
control = "../code-bucket"
scope = "service"

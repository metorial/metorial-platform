[control]
name = "origin"

[service]
port = 52090
dockerfile = "src/systems/origin/apps/service/dev.Dockerfile"
build_context = "oss"
health = { path = "/ping" }

[env]
DATABASE_URL = "postgresql://postgres:postgres@$deps.postgres.5432/origin"
REDIS_URL = "redis://$deps.redis.6379/0"
ORIGIN_SERVICE_PUBLIC_URL = "http://origin:52093"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
CODE_BUCKET_OBJECT_STORAGE_BUCKET = "code-bucket"
CODE_BUCKET_SERVICE_URL = "code-bucket:5050"
CODE_BUCKET_EDITOR_URL = "http://code-bucket:52092"
CODE_BUCKET_EDITOR_API_URL = "http://code-bucket:52091"
SCM_GITHUB_APP_ID = "test-github-app-id"
SCM_GITHUB_APP_SLUG = "test-github-app"
SCM_GITHUB_APP_CLIENT_ID = "test-github-client-id"
SCM_GITHUB_APP_CLIENT_SECRET = "test-github-client-secret"
SCM_GITHUB_APP_PRIVATE_KEY_BASE_64 = "dGVzdC1wcml2YXRlLWtleQ=="

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "origin"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "code-bucket"
control = "../code-bucket"
scope = "service"

[deps.env]
CODE_BUCKET_JWT_SECRET = "dev-secret-change-in-production"
CODE_BUCKET_OBJECT_STORAGE_BUCKET = "code-bucket"
CODE_BUCKET_OBJECT_STORAGE_ENDPOINT = "http://$deps.object-store.52010"
CODE_BUCKET_REDIS_URL = "redis://$deps.redis.6379"
CODE_BUCKET_HTTP_ADDRESS = ":52091"
CODE_BUCKET_WORKSPACE_ADDRESS = ":52092"
CODE_BUCKET_RPC_ADDRESS = ":5050"

[control]
name = "cargo"

[service]
port = 52150
dockerfile = "src/systems/cargo/service/Dockerfile"
build_context = "oss"
health = { path = "/ping", cmd = "bun -e \"fetch('http://localhost:52151/ping').then(()=>process.exit(0)).catch(()=>process.exit(1))\"" }

[test.e2e]
command = "bun run test"
setup = ["bun prisma generate --schema ../db/prisma/schema --config ../db/prisma.config.ts", "bun prisma db push --accept-data-loss --schema ../db/prisma/schema --config ../db/prisma.config.ts"]
cwd = "/app/src/systems/cargo/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "cargo-test"

[[databases]]
adapter = "postgres"
name = "voyager"

[[databases]]
adapter = "postgres"
name = "voyager-search"

[env]
DATABASE_URL = "$db.cargo-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
VOYAGER_URL = "http://$deps.voyager.52060/metorial-voyager"
FILES_BUCKET_NAME = "cargo-files-test"
CARGO_API_PORT = "52150"
CARGO_CONTENT_PORT = "52151"
CARGO_HEALTH_PORT = "12121"
DOWNLOAD_PUBLIC_URL = "http://cargo-content.test"
CARGO_REGION = "tst"
SIGNED_DOWNLOAD_URL_TOKEN_SECRET = "cargo-download-test-secret"
METORIAL_ENV = "development"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "cargo"
POSTGRES_PASSWORD = "cargo"
POSTGRES_DB = "cargo"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "voyager"
mock = "voyager"

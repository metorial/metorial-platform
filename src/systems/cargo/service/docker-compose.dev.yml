services:
  postgres:
    profiles: ['infra']
    image: postgres:16-alpine
    container_name: cargo-postgres
    restart: unless-stopped
    ports:
      - '65432:5432'
    environment:
      POSTGRES_USER: cargo
      POSTGRES_PASSWORD: cargo
      POSTGRES_DB: cargo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cargo']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cargo-network

  redis:
    profiles: ['infra']
    image: redis:7-alpine
    container_name: cargo-redis
    restart: unless-stopped
    ports:
      - '56379:6379'
    networks:
      - cargo-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  object-storage:
    profiles: ['infra']
    image: ghcr.io/metorial/object-storage:latest
    container_name: cargo-object-storage
    restart: unless-stopped
    ports:
      - '65010:52010'
    volumes:
      - object-store-data:/app/data
    environment:
      RUST_LOG: info
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_AWS_ACCESS_KEY_ID:-test}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_AWS_SECRET_ACCESS_KEY:-test}
      AWS_REGION: ${OBJECT_STORAGE_AWS_REGION:-us-east-1}
      OBJECT_STORE__SERVER__HOST: 0.0.0.0
      OBJECT_STORE__SERVER__PORT: 52010
      OBJECT_STORE__BACKEND__TYPE: ${OBJECT_STORAGE_BACKEND_TYPE:-local}
      OBJECT_STORE__BACKEND__ROOT_PATH: ${OBJECT_STORAGE_BACKEND_ROOT_PATH:-/app/data}
      OBJECT_STORE__BACKEND__REGION: ${OBJECT_STORAGE_AWS_REGION:-us-east-1}
      OBJECT_STORE__BACKEND__PHYSICAL_BUCKET: ${OBJECT_STORAGE_AWS_S3_BUCKET:-cargo-local}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:52010/health || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cargo-network

  voyager:
    profiles: ['infra']
    image: ghcr.io/metorial/voyager:latest
    container_name: cargo-voyager
    restart: unless-stopped
    ports:
      - '52060:52060'
    environment:
      DATABASE_URL: postgresql://cargo:cargo@postgres:5432/voyager
      SEARCH_DATABASE_URL: postgresql://cargo:cargo@postgres:5432/voyager-search
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD-SHELL', 'curl -s http://localhost:52060/ > /dev/null || exit 1']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cargo-network

  cargo:
    profiles: ['service']
    build:
      context: ../../../..
      dockerfile: src/systems/cargo/service/dev.Dockerfile
    container_name: cargo-service
    restart: unless-stopped
    ports:
      - '52150:52150'
      - '52151:52151'
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://cargo:cargo@postgres:5432/cargo}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      VOYAGER_URL: ${VOYAGER_URL:-http://voyager:52060/metorial-voyager}
      OBJECT_STORAGE_URL: ${OBJECT_STORAGE_URL:-http://object-storage:52010}
      FILES_BUCKET_NAME: ${FILES_BUCKET_NAME:-mte-files}
      DOWNLOAD_PUBLIC_URL: ${DOWNLOAD_PUBLIC_URL:-http://localhost:52151}
      API_URL: ${API_URL:-http://localhost:52150}
      SIGNED_DOWNLOAD_URL_TOKEN_SECRET: ${SIGNED_DOWNLOAD_URL_TOKEN_SECRET:-cargo-download-test-secret}
      CARGO_REGION: ${CARGO_REGION:-local}
      CARGO_API_PORT: ${CARGO_API_PORT:-52150}
      CARGO_CONTENT_PORT: ${CARGO_CONTENT_PORT:-52151}
      CARGO_HEALTH_PORT: ${CARGO_HEALTH_PORT:-12121}
      ORIGIN_URL: ${ORIGIN_URL:-http://origin:52090/metorial-origin}
      CODE_BUCKET_SERVICE_URL: ${CODE_BUCKET_SERVICE_URL:-code-bucket:5050}
    volumes:
      - ./src:/app/src/systems/cargo/service/src:ro
      - ./package.json:/app/src/systems/cargo/service/package.json:ro
      - ./tsconfig.json:/app/src/systems/cargo/service/tsconfig.json:ro
      - ../db:/app/src/systems/cargo/db
      - ../modules:/app/src/systems/cargo/modules:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      object-storage:
        condition: service_healthy
      voyager:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "bun -e \"fetch('http://localhost:52151/ping').then(()=>process.exit(0)).catch(()=>process.exit(1))\""
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cargo-network

volumes:
  postgres_data:
    driver: local
  object-store-data:
    driver: local

networks:
  cargo-network:
    driver: bridge

name: Shuttle E2E Tests

on:
  push:
    branches: [main, feature/**]
    paths:
      - 'src/systems/shuttle/service/**'
      - 'src/systems/shuttle/clients/**'
      - 'src/systems/shuttle/sdk/**'
      - 'src/systems/_clients/shuttle/**'
      - 'src/systems/shuttle/package.json'
      - 'src/systems/shuttle/bun.lock'
      - 'src/systems/shuttle/.github/workflows/shuttle-e2e-tests.yml'
      - '.github/workflows/system-e2e-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/systems/shuttle/service/**'
      - 'src/systems/shuttle/clients/**'
      - 'src/systems/shuttle/sdk/**'
      - 'src/systems/_clients/shuttle/**'
      - 'src/systems/shuttle/package.json'
      - 'src/systems/shuttle/bun.lock'
      - 'src/systems/shuttle/.github/workflows/shuttle-e2e-tests.yml'
      - '.github/workflows/system-e2e-tests.yml'

jobs:
  e2e-tests:
    name: Run Shuttle E2E Tests
    uses: ./.github/workflows/system-e2e-tests.yml
    secrets: inherit
    with:
      service_directory: src/systems/shuttle/service
      compose_project_prefix: shuttle-ci
      compose_profiles: 'infra service'
      wait_services: |
        shuttle-postgres
        shuttle-redis
        shuttle-object-storage
        shuttle-forge
        shuttle-function-bay
        shuttle-service
      test_container: shuttle-service
      test_command: cd /app/src/systems/shuttle/service && bun run test -- --mode ci --reporter verbose

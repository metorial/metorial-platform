name: Shuttle E2E Tests

on:
  push:
    branches: [main, feature/**]
    paths:
      - 'service/**'
      - 'clients/**'
      - 'package.json'
      - 'bun.lock'
      - '.github/workflows/shuttle-e2e-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'service/**'
      - 'clients/**'
      - 'package.json'
      - 'bun.lock'

jobs:
  e2e-tests:
    name: Run Shuttle E2E Tests
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    with:
      service_directory: service
      compose_project_prefix: shuttle-ci
      compose_profiles: 'infra service'
      wait_services: |
        shuttle-postgres
        shuttle-redis
        shuttle-object-storage
        shuttle-forge
        shuttle-function-bay
        shuttle-service
      test_container: shuttle-service
      test_command: cd /app/service && bun run test -- --mode ci --reporter verbose

[control]
name = "shuttle"

[service]
port = 52080
dockerfile = "src/systems/shuttle/service/Dockerfile"
build_context = "oss"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = ["bun prisma generate", "bun prisma db push --accept-data-loss"]
cwd = "/app/src/systems/shuttle/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "shuttle-test"

[env]
DATABASE_URL = "$db.shuttle-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
PROVIDER_OAUTH_URL = "http://shuttle:52081"
ENCRYPTION_KEY = "ci-encryption-key-32-bytes!!!!"
HOLOPOD_HTTP_ENDPOINT = "test.local:50051"
OBJECT_STORAGE_URL = "http://$deps.object-store.52010"
LOGS_BUCKET_NAME = "shuttle-logs"
FUNCTION_BAY_API_URL = "http://$deps.function-bay.52030/metorial-function-bay"
FUNCTION_BAY_TENANT_IDENTIFIER = "shuttle-ci"
FUNCTION_BAY_DEFAULT_MEMORY_MB = "512"
FUNCTION_BAY_DEFAULT_TIMEOUT_SECONDS = "15"
FORGE_API_URL = "http://$deps.forge.52020/metorial-forge"
DEFAULT_PROVIDER = "aws.lambda"
BUNDLE_BUCKET_NAME = "bundles"
OBJECT_STORAGE_BACKEND_TYPE = "local"
OBJECT_STORAGE_BACKEND_ROOT_PATH = "/app/data"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "postgres"
POSTGRES_PASSWORD = "postgres"
POSTGRES_DB = "postgres"

[[deps]]
name = "redis"
preset = "redis"

[[deps]]
name = "object-store"
mock = "object-store"

[[deps]]
name = "forge"
control = "../../forge/service"
scope = "service"

[[deps]]
name = "function-bay"
control = "../../function-bay/service"
scope = "service"

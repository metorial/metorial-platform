[control]
name = "synthesis"

[service]
port = 52160
dockerfile = "src/systems/synthesis/service/Dockerfile.generated"
build_context = "oss"
health = { path = "/ping" }

[build]
builder = "node"
mode = "generated"
context = "oss"
project = "@metorial/synthesis"
target = "server:build"
dockerfile = "Dockerfile.generated"

[[build.automations]]
name = "synthesis-prisma"
kind = "run-targets"
target = "prisma:generate"
projects = ["@metorial/synthesis"]

[build.artifacts]
copy = [
  { from = "dist", to = "/app/dist" },
  { from = "prisma", to = "/app/prisma" },
  { from = "prisma.config.ts", to = "/app/prisma.config.ts" },
  { from = "/app/node_modules", to = "/app/node_modules" }
]

[build.runtime]
base_image = "oven/bun:1.2-alpine"
packages = ["curl"]
env = { NODE_ENV = "production" }
expose = [52160]
command = "bun prisma db push --config /app/prisma.config.ts --accept-data-loss && bun /app/dist/index.js"
healthcheck = "curl -f http://localhost:52160/ping && curl -f http://localhost:12121/ || exit 1"

[test.unit]
command = "bun run test:unit"

[test.e2e]
command = "bun run test:e2e"
setup = ["bun run db:generate", "bun prisma db push --config ./prisma.config.ts --accept-data-loss"]
cwd = "/app/src/systems/synthesis/service"
runner = "service"

[[databases]]
adapter = "postgres"
name = "synthesis-test"

[env]
SYNTHESIS_DATABASE_URL = "$db.synthesis-test.url"
DATABASE_URL = "$db.synthesis-test.url"
REDIS_URL = "redis://$deps.redis.6379/0"
SYNTHESIS_API_PORT = "52160"
SYNTHESIS_HEALTH_PORT = "12121"

[[deps]]
name = "postgres"
preset = "postgres"

[deps.env]
POSTGRES_USER = "synthesis"
POSTGRES_PASSWORD = "synthesis"
POSTGRES_DB = "synthesis"

[[deps]]
name = "redis"
preset = "redis"

name = "@metorial/shuttle"
group = "oss"

[[dependencies]]
identifier = "@metorial/function-bay"
env = [
  { endpoint = "api", key = "FUNCTION_BAY_API_URL", value = "http://{{HOSTNAME}}:{{PORT}}/metorial-function-bay" },
]

[[dependencies]]
identifier = "@metorial/nebula"
env = [
  { endpoint = "api", key = "NEBULA_API_URL", value = "http://{{HOSTNAME}}:{{PORT}}/metorial-nebula" },
]

[[dependencies]]
identifier = "@metorial/object-storage"
env = [
  { endpoint = "rpc", key = "OBJECT_STORAGE_URL", value = "http://{{HOSTNAME}}:{{PORT}}" },
]

[test.e2e]
start = ["test:start-e2e"]

[dev]
run = ["dev:start"]

[endpoints.api]
port = 52080
env = [{ key = "SHUTTLE_API_PORT", value = "{{PORT}}" }]

[endpoints.public]
port = 52081
env = [
  { key = "SHUTTLE_PUBLIC_PORT", value = "{{PORT}}" },
  { key = "PROVIDER_OAUTH_URL", value = "http://{{HOSTNAME}}:{{PORT}}" },
]

[[resources]]
type = "redis"
env = [{ key = "REDIS_URL", value = "redis://{{HOSTNAME}}:{{PORT}}/0" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
ENCRYPTION_KEY = "local-dev-encryption-key"
HOLOPOD_HTTP_ENDPOINT = "http://holopod:3000"
SHUTTLE_ALLOW_PRIVATE_URLS = "true"
SHUTTLE_UNSAFE_SSRF_BYPASS = "true"
LOGS_BUCKET_NAME = "shuttle-logs"
FUNCTION_BAY_TENANT_IDENTIFIER = "dev-tenant"
FUNCTION_BAY_DEFAULT_MEMORY_MB = "512"
FUNCTION_BAY_DEFAULT_TIMEOUT_SECONDS = "15"
NEBULA_CONSUMER_IDENTIFIER = "dev-shuttle"
NEBULA_CONSUMER_TOKEN = "local-dev-nebula-shuttle-registration-secret"
SHUTTLE_DELEGATE_SECRETS_TO_NEBULA = "true"

[dev.db.main]
package = "@metorial/shuttle"
name = "shuttle"
engine = "postgres"
env = "DATABASE_URL"

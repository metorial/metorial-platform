name = "@metorial/slates"
group = "oss"

[[dependencies]]
identifier = "@metorial/function-bay"
env = [
  { endpoint = "api", key = "FUNCTION_BAY_API_URL", value = "http://{{HOSTNAME}}:{{PORT}}/metorial-function-bay" },
]

[[dependencies]]
identifier = "@metorial/signal"
env = [
  { endpoint = "api", key = "SIGNAL_API_URL", value = "http://{{HOSTNAME}}:{{PORT}}/metorial-signal" },
]

[[dependencies]]
identifier = "@metorial/nebula"
env = [
  { endpoint = "api", key = "NEBULA_API_URL", value = "http://{{HOSTNAME}}:{{PORT}}/metorial-nebula" },
]

[[dependencies]]
identifier = "@metorial/slates-registry"
env = [
  { endpoint = "public", key = "INITIAL_REGISTRIES", value = "http://{{HOSTNAME}}:{{PORT}}" },
]

[dev]
prepare = ["admin:build"]
run = ["dev:start"]

[endpoints.public]
port = 52045
health = "/ping"
env = [
  { key = "SLATES_HUB_PUBLIC_PORT", value = "{{BIND_PORT}}" },
  { key = "SERVICE_PUBLIC_URL", value = "http://{{HOSTNAME}}:{{PORT}}" },
]

[endpoints.internal]
port = 52046
env = [{ key = "SLATES_HUB_INTERNAL_PORT", value = "{{BIND_PORT}}" }]

[endpoints.admin]
port = 52047
env = [{ key = "SLATES_HUB_ADMIN_PORT", value = "{{BIND_PORT}}" }]

[e2e]
start = ["e2e:start"]
image = "slates-hub"

[[resources]]
type = "redis"
env = [{ key = "REDIS_URL", value = "redis://{{HOSTNAME}}:{{PORT}}/0" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
ENCRYPTION_KEY = "sTrG+z8ewVo7JJsgmv39UL/YDdgxlHSVhVPJOV7Omdg"
OBJECT_STORAGE_URL = "http://services:52010"
FUNCTION_BAY_TENANT_IDENTIFIER = "dev-tenant"
FUNCTION_BAY_DEFAULT_MEMORY_MB = "512"
FUNCTION_BAY_DEFAULT_TIMEOUT_SECONDS = "60"
SIGNAL_SENDER_IDENTIFIER = "dev-slates-hub"
INVOCATIONS_BUCKET_NAME = "dev-invocations"
SLATES_HUB_INSTANCE_IDENTIFIER = "dev-slates-hub"
SUPPORTS_PREBUILT_SLATES = "true"
SLATE_DEPLOYMENT_NPM_REGISTRY_URL = true
SLATES_WEBHOOK_TRIGGER_HOST = true
NEBULA_CONSUMER_IDENTIFIER = "dev-slates-hub"
NEBULA_CONSUMER_TOKEN = "local-dev-nebula-slates-registration-secret"
SLATES_DELEGATE_SECRETS_TO_NEBULA = "true"
SUBSPACE_INTERNAL_URL = "http://{{HOSTNAME}}:4317/subspace-internal"
SLATE_ATTACHMENT_SIGNING_SECRET = "dev-slate-attachment-signing-secret"

[dev.db.main]
package = "@metorial/slates"
name = "slates-hub"
engine = "postgres"
env = "DATABASE_URL"

[[ci.images]]
name = "slates-hub"
group = "oss"
dockerfile = "Dockerfile"
image = "metorial/mte-slates-hub"
ecr = "metorial-enterprise-saas/mte-slates-hub"
canonical = "ghcr.io/metorial/slates-hub"

[ci.suite]
name = "slates-hub"
runner = "compose"
profiles = ["hub", "infra"]

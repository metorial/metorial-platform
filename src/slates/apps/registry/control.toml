name = "@metorial/slates-registry"
group = "oss"

[dev]
prepare = ["admin:build"]
run = ["dev:start"]

[endpoints.public]
port = 52040
health = "/ping"
env = [
  { key = "SLATES_REGISTRY_PUBLIC_PORT", value = "{{BIND_PORT}}" },
  { key = "SERVICE_PUBLIC_URL", value = "http://{{HOSTNAME}}:{{PORT}}" },
]

[endpoints.internal]
port = 52041
env = [{ key = "SLATES_REGISTRY_INTERNAL_PORT", value = "{{BIND_PORT}}" }]

[endpoints.admin]
port = 52042
env = [{ key = "SLATES_REGISTRY_ADMIN_PORT", value = "{{BIND_PORT}}" }]

[e2e]
start = ["e2e:start"]
image = "slates-registry"

[[resources]]
type = "redis"
env = [{ key = "REDIS_URL", value = "redis://{{HOSTNAME}}:{{PORT}}/0" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
OBJECT_STORAGE_URL = "http://services:52010"
PACKAGE_BUCKET_NAME = "package-bucket"

[dev.db.main]
package = "@metorial/slates-registry"
name = "slates-registry"
engine = "postgres"
env = "DATABASE_URL"

[[ci.images]]
name = "slates-registry"
group = "oss"
dockerfile = "Dockerfile"
image = "metorial/mte-slates-registry"
ecr = "metorial-enterprise-saas/mte-slates-registry"
canonical = "ghcr.io/metorial/slates-registry"

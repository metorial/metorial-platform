name = "@metorial/synthesis"
group = "oss"

[dev]
run = ["dev:start"]

[endpoints.api]
port = 52160
health = "/ping"
env = [{ key = "SYNTHESIS_API_PORT", value = "{{BIND_PORT}}" }]

[endpoints.health]
port = 12121
env = [{ key = "SYNTHESIS_HEALTH_PORT", value = "{{BIND_PORT}}" }]

[e2e]
start = ["e2e:start"]
image = "synthesis"

[[resources]]
type = "redis"
env = [{ key = "REDIS_URL", value = "redis://{{HOSTNAME}}:{{PORT}}/0" }]

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
AI_GATEWAY_API_KEY = true
SCOUT_URL = "https://scout-fra-fly-prod.metorial-enterprise.com/metorial-scout"
SCOUT_TOKEN = true
SUBSPACE_SOLUTION = "metorial-dev"

[dev.db.main]
package = "@metorial/synthesis"
name = "synthesis"
engine = "postgres"
env = "SYNTHESIS_DATABASE_URL"

[[ci.images]]
name = "synthesis"
group = "oss"
dockerfile = "Dockerfile"
image = "metorial/mte-synthesis"
ecr = "metorial-enterprise-saas/mte-synthesis"
canonical = "ghcr.io/metorial/synthesis"

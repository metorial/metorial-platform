name = "@metorial/synthesis"
group = "oss"

[dev]
run = ["bun --watch ./src/server.ts"]

[[dev.expose]]
port = 52160

[[dev.expose]]
port = 12121

[dev.env]
METORIAL_ENV = "development"
METORIAL_SOURCE = "oss"
IS_ENTERPRISE = "false"
METORIAL_HOSTNAME = "{{HOSTNAME}}"
NODE_ENV = "development"
REDIS_URL = "redis://localhost:36379/0"
SYNTHESIS_API_PORT = "52160"
SYNTHESIS_HEALTH_PORT = "12121"
AI_GATEWAY_API_KEY = true
SCOUT_URL = "https://scout-fra-fly-prod.metorial-enterprise.com/metorial-scout"
SCOUT_TOKEN = true
SUBSPACE_SOLUTION = "metorial-dev"
SUBSPACE_URL = "http://localhost:52070/subspace-controller"
SUBSPACE_CONNECTION_URL = "http://localhost:52072"

[dev.db.main]
name = "synthesis"
engine = "postgres"
env = "SYNTHESIS_DATABASE_URL"

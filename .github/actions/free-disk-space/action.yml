name: Start freeing disk space
description: Remove unused preinstalled toolchains in the background; control-e2e waits for it before loading stack images
runs:
  using: composite
  steps:
    - name: Start freeing disk space
      if: runner.environment == 'github-hosted' && runner.os == 'Linux'
      shell: bash
      run: |
        set -euo pipefail
        sudo nohup rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
          > /dev/null 2>&1 &
        echo "$!" > "$RUNNER_TEMP/free-disk-space.pid"

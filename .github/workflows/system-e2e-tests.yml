name: 'System E2E Tests'

on:
  workflow_call:
    inputs:
      service_directory:
        description: 'Directory containing the compose setup'
        required: true
        type: string
      compose_project_prefix:
        description: 'Docker compose project prefix'
        required: true
        type: string
      compose_profiles:
        description: 'Compose profiles to enable'
        required: true
        type: string
      wait_mode:
        description: 'Service wait mode'
        required: false
        default: ''
        type: string
      wait_services:
        description: 'Services to wait for, one per line'
        required: true
        type: string
      test_container:
        description: 'Container that runs the test command'
        required: true
        type: string
      test_command:
        description: 'Command executed inside the test container'
        required: true
        type: string
      checkout_submodules:
        description: 'Whether to checkout git submodules'
        required: false
        default: false
        type: boolean
      submodule_setup_command:
        description: 'Optional shell command after submodule checkout'
        required: false
        default: ''
        type: string

jobs:
  e2e-tests:
    permissions:
      contents: read
      packages: read
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    secrets: inherit
    with:
      service_directory: ${{ inputs.service_directory }}
      compose_project_prefix: ${{ inputs.compose_project_prefix }}
      compose_profiles: ${{ inputs.compose_profiles }}
      wait_mode: ${{ inputs.wait_mode }}
      wait_services: ${{ inputs.wait_services }}
      test_container: ${{ inputs.test_container }}
      test_command: ${{ inputs.test_command }}
      checkout_submodules: ${{ inputs.checkout_submodules }}
      submodule_setup_command: ${{ inputs.submodule_setup_command }}

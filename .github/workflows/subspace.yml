name: 'Subspace'

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: 'Subspace Build'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        service:
          - name: worker
            dockerfile: ./src/metorial/subspace/apps/worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  conduit-integration:
    name: 'Conduit Integration (Redis + NATS)'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Packages
        run: bun i --linker=hoisted

      # Docker is preinstalled on ubuntu-latest. The Vitest globalSetup brings the
      # Redis + NATS containers up (and tears them down), so no `services:` block
      # is needed and local == CI via the same compose-driven setup.
      - name: Run conduit integration tests
        run: bun run test:integration
        working-directory: src/metorial/subspace/packages/conduit

name: 'Subspace'

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: 'Subspace Build'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        service:
          - name: controller
            dockerfile: ./src/systems/subspace/apps/controller/Dockerfile
          - name: worker
            dockerfile: ./src/systems/subspace/apps/worker/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service.name }} Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/systems/subspace
          file: ${{ matrix.service.dockerfile }}
          push: false
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  public:
    name: 'Subspace Public'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      - name: Install packages
        working-directory: ./src/systems/subspace
        run: bun install

      - name: Build public frontend
        working-directory: ./src/systems/subspace/apps/public
        run: bun run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build public Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./src/systems/subspace
          file: ./src/systems/subspace/apps/public/Dockerfile
          push: false
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  test:
    name: 'Subspace Test'
    permissions:
      contents: read
      packages: read
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    secrets: inherit
    with:
      service_directory: src/systems/subspace
      compose_project_prefix: subspace-ci
      compose_profiles: 'infra'
      wait_services: |
        subspace-postgres
        subspace-redis
        subspace-object-storage
        subspace-forge
        subspace-function-bay
        subspace-signal
        subspace-voyager
        subspace-slates-registry
        subspace-slates-hub
        subspace-shuttle
        subspace-mcp-test-server
        subspace-controller-test-service
      test_container: subspace-controller-test-service
      test_command: cd /app/apps/controller && set -a && . ./.env.ci && set +a && bunx prisma db push --schema ../../db/prisma/schema --config ../../db/prisma.config.ts && bunx prisma generate --schema ../../db/prisma/schema --config ../../db/prisma.config.ts && bun run test:ci

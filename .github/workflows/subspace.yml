name: 'Subspace'

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: 'Subspace Build'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    strategy:
      matrix:
        service:
          - name: worker
            dockerfile: ./src/metorial/products/integrations/apps/worker/Dockerfile
            package: '@metorial-subspace/app-worker'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - uses: oven-sh/setup-bun@v2
      - id: affected
        uses: ./.github/actions/affected-image
        with:
          package: ${{ matrix.service.package }}
          tasks: 'prisma:generate server:build'
      - uses: ./.github/actions/setup-warp-cache
        with:
          aws-access-key-id: ${{ secrets.WARP_CACHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WARP_CACHE_AWS_SECRET_ACCESS_KEY }}
          signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          role-arn: ${{ vars.WARP_CACHE_ROLE_ARN }}
          bucket: ${{ vars.WARP_CACHE_BUCKET }}

      - name: Build ${{ matrix.service.name }} Docker image
        if: steps.affected.outputs.should-build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          push: false
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            TURBO_API=http://127.0.0.1:8787
            TURBO_TEAM=metorial
          secrets: |
            turbo_token=${{ env.TURBO_TOKEN }}
            turbo_signature=${{ env.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-linux-amd64
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && format('type=gha,mode=max,scope={0}-linux-amd64', matrix.service.name) || '' }}

      - name: Report Warp Cache
        if: always()
        run: sh ./src/tooling/warp-cache/report.sh

  conduit-integration:
    name: 'Conduit Integration (Redis + NATS)'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Packages
        run: bun i --linker=hoisted

      # Docker is preinstalled on ubuntu-latest. The Vitest globalSetup brings the
      # Redis + NATS containers up (and tears them down), so no `services:` block
      # is needed and local == CI via the same compose-driven setup.
      - name: Run conduit integration tests
        run: bun run test:integration
        working-directory: src/metorial/products/integrations/packages/conduit

name: 'Slates'

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: 'Slates Build'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: hub
            image: ghcr.io/metorial/slates-hub
            dockerfile: ./src/slates/apps/hub/Dockerfile
            package: '@metorial/slates'
          - name: registry
            image: ghcr.io/metorial/slates-registry
            dockerfile: ./src/slates/apps/registry/Dockerfile
            package: '@metorial/slates-registry'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - uses: oven-sh/setup-bun@v2
      - id: affected
        uses: ./.github/actions/affected-image
        with:
          package: ${{ matrix.service.package }}
          tasks: 'prisma:generate admin:build server:build'
      - uses: ./.github/actions/setup-warp-cache
        with:
          aws-access-key-id: ${{ secrets.WARP_CACHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WARP_CACHE_AWS_SECRET_ACCESS_KEY }}
          signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          role-arn: ${{ vars.WARP_CACHE_ROLE_ARN }}
          bucket: ${{ vars.WARP_CACHE_BUCKET }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        if: steps.affected.outputs.should-build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.service.dockerfile }}
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            TURBO_API=http://127.0.0.1:8787
            TURBO_TEAM=metorial
          secrets: |
            turbo_token=${{ env.TURBO_TOKEN }}
            turbo_signature=${{ env.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          cache-from: type=gha,scope=${{ matrix.service.name }}-linux-amd64
          cache-to: ${{ github.event_name == 'push' && github.ref == 'refs/heads/dev' && format('type=gha,mode=max,scope={0}-linux-amd64', matrix.service.name) || '' }}

      - name: Report Warp Cache
        if: always()
        run: sh ./src/tooling/warp-cache/report.sh

  test:
    name: 'Slates Hub Test'
    permissions:
      contents: read
      packages: read
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    secrets: inherit
    with:
      service_directory: src/slates/apps/hub
      compose_project_prefix: slates-hub-ci
      compose_profiles: 'hub infra'
      wait_mode: healthy
      wait_services: |
        slates-hub-postgres
        slates-hub-redis
        slates-hub-object-storage
        slates-hub-forge
        slates-hub-signal
        slates-hub-function-bay
        slates-hub-registry
      test_container: slates-hub-service
      test_command: cd /app/src/slates/apps/hub && bun run test

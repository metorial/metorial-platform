name: 'Slates'

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: 'Slates Build'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service:
          - name: hub
            image: ghcr.io/metorial/slates-hub
            context: ./src/systems/slates/apps/hub
            dockerfile: ./src/systems/slates/apps/hub/Dockerfile
          - name: registry
            image: ghcr.io/metorial/slates-registry
            context: ./src/systems/slates/apps/registry
            dockerfile: ./src/systems/slates/apps/registry/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  test:
    name: 'Slates Hub Test'
    permissions:
      contents: read
      packages: read
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    secrets: inherit
    with:
      service_directory: src/systems/slates/apps/hub
      compose_project_prefix: slates-hub-ci
      compose_profiles: 'hub infra'
      wait_mode: healthy
      wait_services: |
        slates-hub-postgres
        slates-hub-redis
        slates-hub-object-storage
        slates-hub-forge
        slates-hub-signal
        slates-hub-function-bay
        slates-hub-registry
      test_container: slates-hub-service
      test_command: cd /app && bun run test

name: Backend Services

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: 'Build ${{ matrix.service.name }}'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: forge
            image: ghcr.io/metorial/forge
            dockerfile: ./src/forge/service/Dockerfile
          - name: nebula
            image: ghcr.io/metorial/nebula
            dockerfile: ./src/nebula/service/Dockerfile
          - name: function-bay
            image: ghcr.io/metorial/function-bay
            dockerfile: ./src/function-bay/service/Dockerfile
          - name: shuttle
            image: ghcr.io/metorial/shuttle
            dockerfile: ./src/shuttle/service/Dockerfile
          - name: relay
            image: ghcr.io/metorial/relay
            dockerfile: ./src/relay/service/Dockerfile
          - name: voyager
            image: ghcr.io/metorial/voyager
            dockerfile: ./src/voyager/service/Dockerfile
          - name: slates-hub
            image: ghcr.io/metorial/slates-hub
            dockerfile: ./src/slates/apps/hub/Dockerfile
          - name: slates-registry
            image: ghcr.io/metorial/slates-registry
            dockerfile: ./src/slates/apps/registry/Dockerfile
          - name: signal
            image: ghcr.io/metorial/signal
            dockerfile: ./src/signal/service/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || github.token }}

      - name: Resolve reusable image
        id: image
        uses: ./.github/actions/image-cache
        with:
          anonymous: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
          publish: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          dockerfile: ${{ matrix.service.dockerfile }}
          image: ${{ matrix.service.image }}

      - uses: ./.github/actions/setup-warp-cache
        if: steps.image.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          aws-access-key-id: ${{ secrets.WARP_CACHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WARP_CACHE_AWS_SECRET_ACCESS_KEY }}
          signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          role-arn: ${{ vars.WARP_CACHE_ROLE_ARN }}
          bucket: ${{ vars.WARP_CACHE_BUCKET }}

      - name: Set up Docker Buildx
        if: steps.image.outputs.hit != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.service.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prune Docker workspace
        id: prune
        if: steps.image.outputs.hit != 'true'
        uses: ./.github/actions/prune-docker
        with:
          prepared: ${{ steps.image.outputs.prepared }}
          dockerfile: ${{ matrix.service.dockerfile }}

      - name: Cache Docker dependencies
        if: steps.image.outputs.hit != 'true' && steps.prune.outputs.pruned == 'true' && steps.prune.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: pruned=${{ steps.prune.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          target: dependencies
          push: false
          cache-to: type=local,mode=max,dest=${{ steps.prune.outputs.cache-path }}/layers

      - name: Save Docker dependency cache
        if: steps.image.outputs.hit != 'true' && steps.prune.outputs.pruned == 'true' && steps.prune.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prune.outputs.cache-path }}
          key: ${{ steps.prune.outputs.cache-key }}

      - name: Build and push Docker image
        if: steps.image.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: pruned=${{ steps.prune.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          # platforms: linux/amd64,linux/arm64
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-from: ${{ steps.prune.outputs.pruned == 'true' && format('type=local,src={0}/layers', steps.prune.outputs.cache-path) || format('type=gha,scope={0}-{1}-{2}', github.workflow, github.job, matrix.service.name || 'image') }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ${{ matrix.service.image }}:${{ steps.image.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            TURBO_API=http://127.0.0.1:8787
            TURBO_TEAM=metorial
          secrets: |
            turbo_token=${{ env.TURBO_TOKEN }}
            turbo_signature=${{ env.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Publish reused image aliases
        if: steps.image.outputs.hit == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SOURCE: ${{ steps.image.outputs.source }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CACHE_IMAGE: ${{ matrix.service.image }}:${{ steps.image.outputs.tag }}
        run: bun src/tooling/docker-build/image-cache.ts copy "$SOURCE" "$TAGS $CACHE_IMAGE"

      - name: Report Warp Cache
        if: always() && steps.image.outputs.hit != 'true'
        run: sh ./src/tooling/warp-cache/report.sh

      - name: Record tested image
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: ./.github/actions/image-artifact
        with:
          name: ${{ matrix.service.name }}
          image: ${{ matrix.service.image }}:${{ steps.image.outputs.tag }}

  e2e:
    name: '${{ matrix.service.name }} E2E'
    needs: build
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        service:
          - { name: forge, package: '@metorial/forge' }
          - { name: nebula, package: '@metorial/nebula' }
          - { name: function-bay, package: '@metorial/function-bay' }
          - { name: shuttle, package: '@metorial/shuttle' }
          - { name: slates-hub, package: '@metorial/slates' }
          - { name: relay, package: '@metorial/relay' }
          - { name: voyager, package: '@metorial/voyager' }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || github.token }}
      - uses: ./.github/actions/setup-test-workspace
        id: tests
        with:
          tasks: prisma:generate test:e2e --filter=${{ matrix.service.package }}
      - uses: ./.github/actions/setup-warp-cache
        with:
          aws-access-key-id: ${{ secrets.WARP_CACHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WARP_CACHE_AWS_SECRET_ACCESS_KEY }}
          signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          role-arn: ${{ vars.WARP_CACHE_ROLE_ARN }}
          bucket: ${{ vars.WARP_CACHE_BUCKET }}
      - name: Restore test prerequisites
        working-directory: ${{ steps.tests.outputs.workspace }}
        run: bunx turbo@2.9.18 run prisma:generate build --ui=stream --concurrency=2
      - uses: ./.github/actions/backend-e2e
        with:
          suite: ${{ matrix.service.name }}
          test-workspace: ${{ steps.tests.outputs.workspace }}
      - name: Report Warp Cache
        if: always()
        run: sh src/tooling/warp-cache/report.sh

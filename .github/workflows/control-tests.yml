# This file is generated by `control generate actions`. Do not edit it directly.
name: Control Tests

on:
  workflow_dispatch:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
      - name: Run unit tests
        run: cargo run --quiet --manifest-path src/control/Cargo.toml -- test unit --all

  e2e:
    name: E2E (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - "@metorial-subspace/app-controller"
          - "@metorial-subspace/app-public"
          - "@metorial-subspace/app-worker"
          - "@metorial/app-api"
          - "@metorial/app-dashboard"
          - "@metorial/ares"
          - "@metorial/code-bucket-service-generated"
          - "@metorial/code-workspace"
          - "@metorial/forge"
          - "@metorial/function-bay"
          - "@metorial/nebula"
          - "@metorial/object-storage"
          - "@metorial/origin"
          - "@metorial/relay"
          - "@metorial/shuttle"
          - "@metorial/signal"
          - "@metorial/slates"
          - "@metorial/slates-registry"
          - "@metorial/synthesis"
          - "@metorial/voyager"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
      - name: Run E2E tests
        run: cargo run --quiet --manifest-path src/control/Cargo.toml -- test e2e "${{ matrix.service }}"

name: 'Test OSS'

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'
    branches:
      - dev
      - main

jobs:
  test-monorepo-ts:
    name: 'Test Monorepo TS'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # - name: Patch bun
      #   run: mv _package.json package.json

      - name: Install Packages
        run: bun i --linker=hoisted

      - name: Generate Prisma Clients
        run: bun run prisma:generate

      - name: Test
        run: bun run test

  test-signal-e2e:
    name: 'Test Signal E2E'
    permissions:
      contents: read
      packages: read
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    secrets: inherit
    with:
      service_directory: src/systems/signal/service
      compose_project_prefix: signal-ci
      compose_profiles: 'infra service'
      wait_services: |
        signal-postgres
        signal-redis
        signal-object-storage
        signal-service
      test_container: signal-service
      test_command: cd /app/service && bun run test -- --mode ci --reporter verbose

  test-slates-hub-e2e:
    name: 'Test Slates Hub E2E'
    permissions:
      contents: read
      packages: read
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    secrets: inherit
    with:
      service_directory: src/systems/slates/apps/hub
      compose_project_prefix: slates-hub-ci
      compose_profiles: 'hub infra'
      wait_mode: healthy
      wait_services: |
        slates-hub-postgres
        slates-hub-redis
        slates-hub-object-storage
        slates-hub-forge
        slates-hub-signal
        slates-hub-function-bay
        slates-hub-registry
      test_container: slates-hub-service
      test_command: cd /app/apps/hub && bun run test -- --mode ci

  test-subspace-e2e:
    name: 'Test Subspace E2E'
    permissions:
      contents: read
      packages: read
    uses: metorial/.github/.github/workflows/reusable-e2e-tests.yml@main
    secrets: inherit
    with:
      service_directory: src/systems/subspace
      compose_project_prefix: subspace-ci
      compose_profiles: 'infra'
      wait_services: |
        subspace-postgres
        subspace-redis
        subspace-object-storage
        subspace-forge
        subspace-function-bay
        subspace-signal
        subspace-voyager
        subspace-slates-registry
        subspace-slates-hub
        subspace-shuttle
        subspace-mcp-test-server
        subspace-controller-test-service
      test_container: subspace-controller-test-service
      test_command: cd /app/apps/controller && set -a && . ./.env.ci && set +a && bunx prisma db push --schema ../../db/prisma/schema --config ../../db/prisma.config.ts && bunx prisma generate --schema ../../db/prisma/schema --config ../../db/prisma.config.ts && bun run test:ci

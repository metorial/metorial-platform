name: 'Build and Test'

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/**'
  pull_request:
    paths:
      - 'src/**'
    branches:
      - dev
      - main

jobs:
  build-and-test-ts:
    name: 'Build and Test TS'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # - name: Patch bun
      #   run: mv _package.json package.json

      - name: Install Packages
        run: bun i --linker=hoisted

      - name: Generate Prisma Clients
        run: bunx turbo run --ui=stream prisma:generate --filter=!./src/systems/**

      - name: Build Packages
        run: bunx turbo run --ui=stream build --filter=!./src/systems/**

      - name: Test
        run: bunx turbo run --concurrency=1 --ui=stream test --filter=!./src/systems/**

name: 'Build and Test'

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:

jobs:
  build-and-test-ts:
    name: 'Build and Test TS'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up Warp Cache
        uses: ./.github/actions/setup-warp-cache
        with:
          aws-access-key-id: ${{ secrets.WARP_CACHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WARP_CACHE_AWS_SECRET_ACCESS_KEY }}
          signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          role-arn: ${{ vars.WARP_CACHE_ROLE_ARN }}
          bucket: ${{ vars.WARP_CACHE_BUCKET }}

      # - name: Patch bun
      #   run: mv _package.json package.json

      - name: Install Packages
        run: bun i --linker=hoisted

      - name: Generate Prisma Clients
        run: |
          bunx turbo run --ui=stream prisma:generate

      - name: Build Packages
        run: |
          bunx turbo run --ui=stream build --filter=!./src/**
          bunx turbo run --ui=stream build --filter=./src/*/clients/** --filter=!./src/origin/clients/**
          bunx turbo run --ui=stream build --filter='./src/outpost/*/*'

      - name: Test Metorial Packages
        run: bunx turbo run --concurrency=1 --ui=stream test --filter='./src/metorial/packages/*'

      - name: Test Metorial Modules
        run: bunx turbo run --concurrency=1 --ui=stream test --filter='./src/metorial/products/**'

      - name: Test Lowerdeck Packages
        run: bunx turbo run --concurrency=1 --ui=stream test --filter='./src/lowerdeck/**'

      - name: Report Warp Cache
        if: always()
        run: sh ./src/tooling/warp-cache/report.sh

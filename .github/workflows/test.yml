name: 'Build and Test'

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  build-and-test-ts:
    name: 'Build and Test TS'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      # - name: Patch bun
      #   run: mv _package.json package.json

      - name: Install Packages
        run: bun i --linker=hoisted

      - name: Generate Prisma Clients
        run: |
          bunx turbo run --ui=stream prisma:generate

      - name: Build Packages
        run: |
          bunx turbo run --ui=stream build --filter=!./src/**
          bunx turbo run --ui=stream build --filter=./src/*/clients/** --filter=!./src/origin/clients/**
          bunx turbo run --ui=stream build --filter='./src/outpost/*/*'

      - name: Test Metorial Packages
        run: bunx turbo run --concurrency=1 --ui=stream test --filter='./src/metorial/packages/*'

      - name: Test Metorial Modules
        run: bunx turbo run --concurrency=1 --ui=stream test --filter='./src/metorial/products/**'

      - name: Test Lowerdeck Packages
        run: bunx turbo run --concurrency=1 --ui=stream test --filter='./src/lowerdeck/**'

name: 'Build and Test'

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:

jobs:
  changes:
    name: Detect affected tests
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.changes.outputs.units }}
      unit-tasks: ${{ steps.changes.outputs.unit-tasks }}
      e2e: ${{ steps.changes.outputs.e2e }}
      matrix: ${{ steps.changes.outputs.matrix }}
      conduit: ${{ steps.changes.outputs.conduit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}
      - uses: ./.github/actions/detect-test-changes
        id: changes
        with:
          tasks: test --filter=./src/metorial/packages/* --filter=./src/metorial/products/** --filter=./src/lowerdeck/** --filter=@metorial/nebula --filter=@metorial/function-bay --filter=@metorial/shuttle --filter=@metorial/slates --filter=@metorial/relay

  build-and-test-ts:
    needs: changes
    if: needs.changes.outputs.units == 'true'
    name: 'Build and Test TS'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Set up test workspace
        id: tests
        uses: ./.github/actions/setup-test-workspace
        with:
          tasks: ${{ needs.changes.outputs.unit-tasks }}

      - name: Set up Warp Cache
        uses: ./.github/actions/setup-warp-cache
        with:
          cache-bun-downloads: 'false'
          aws-access-key-id: ${{ secrets.WARP_CACHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WARP_CACHE_AWS_SECRET_ACCESS_KEY }}
          signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          role-arn: ${{ vars.WARP_CACHE_ROLE_ARN }}
          bucket: ${{ vars.WARP_CACHE_BUCKET }}

      - name: Test packages and services
        working-directory: ${{ steps.tests.outputs.workspace }}
        run: bun src/tooling/test-ci/run.ts --concurrency=2 --ui=stream

      - name: Test CI tooling
        working-directory: ${{ steps.tests.outputs.workspace }}
        run: bun test src/tooling/test-ci/*.test.ts

      - name: Report Warp Cache
        if: always()
        run: sh ./src/tooling/warp-cache/report.sh

  check-object-storage:
    name: 'Check object storage'
    runs-on: ubuntu-latest
    env:
      TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Find affected Rust tasks
        id: affected
        run: |
          set -euo pipefail
          count=$(bunx turbo@2.11.7 run rust:check --affected --filter=@metorial/object-storage --dry=json | bun -e 'console.log(JSON.parse(await Bun.stdin.text()).tasks.length)')
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.affected.outputs.count != '0'
        uses: dtolnay/rust-toolchain@1.91.0
        with:
          components: rustfmt, clippy

      - name: Restore Cargo and target caches
        if: steps.affected.outputs.count != '0'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src/object-storage
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      - name: Format, check, lint and test
        if: steps.affected.outputs.count != '0'
        run: bunx turbo@2.11.7 run rust:fmt rust:check rust:lint rust:test --affected --filter=@metorial/object-storage --ui=stream

name: Control

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/control/**'
      - 'scripts/dev-tools/workspace/**'
      - 'scripts/dev-tools/services.docker-compose.yml'
      - '**/control.toml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/control.yml'
  push:
    paths:
      - 'src/control/**'
      - 'scripts/dev-tools/workspace/**'
      - 'scripts/dev-tools/services.docker-compose.yml'
      - '**/control.toml'
      - 'package.json'
      - 'turbo.json'
      - '.github/workflows/control.yml'

jobs:
  test:
    name: Build and test Control
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.91.1
          components: clippy,rustfmt

      - name: Run Clippy
        working-directory: src/control
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        working-directory: src/control
        run: cargo test --all-features

      - name: Validate repository manifests
        run: cargo run --quiet --manifest-path src/control/Cargo.toml -- dev --dry-run

      - name: Validate workspace Compose files
        run: |
          docker compose --file scripts/dev-tools/workspace/proxy.docker-compose.yml config --quiet
          docker compose --file scripts/dev-tools/workspace/services.docker-compose.yml config --quiet
          docker compose --file scripts/dev-tools/services.docker-compose.yml config --quiet

      - name: Build workspace development image
        run: docker build --file scripts/dev-tools/workspace/Dockerfile scripts/dev-tools/workspace

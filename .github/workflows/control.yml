name: Control

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build all services
    uses: ./.github/workflows/reusable-control.yml
    secrets: inherit
    with:
      command: build
      all: true
      runs-on: depot-ubuntu-24.04-4

  unit:
    name: Unit (${{ matrix.service }})
    uses: ./.github/workflows/reusable-control.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        service:
          - ares
          - cargo
          - code-bucket
          - deflector
          - forge
          - function-bay
          - origin
          - shuttle
          - signal
          - slates-hub
          - slates-registry
          - subspace-controller
          - subspace-public
          - subspace-worker
          - synthesis
          - voyager
          - relay
          - object-storage
    with:
      command: ci
      mode: unit
      filter: ${{ matrix.service }}
      runs-on: depot-ubuntu-24.04-4

  e2e:
    name: E2E (${{ matrix.service }})
    uses: ./.github/workflows/reusable-control.yml
    secrets: inherit
    strategy:
      fail-fast: false
      matrix:
        service:
          - ares
          - cargo
          - code-bucket
          - deflector
          - forge
          - function-bay
          - origin
          - shuttle
          - signal
          - slates-hub
          - slates-registry
          - subspace-controller
          - subspace-public
          - subspace-worker
          - synthesis
          - voyager
          - relay
          - object-storage
    with:
      command: ci
      mode: e2e
      filter: ${{ matrix.service }}
      project_prefix: ${{ matrix.service }}-ci
      runs-on: depot-ubuntu-24.04-4
      checkout_submodules: ${{ matrix.service == 'subspace-controller' }}

name: 'Ares'

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: 'Ares Build'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GH_TOKEN || github.token }}

      - name: Resolve reusable image
        id: image
        uses: ./.github/actions/image-cache
        with:
          lookup: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          publish: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          dockerfile: ./src/ares/service/Dockerfile
          image: ghcr.io/metorial/ares

      - uses: ./.github/actions/setup-warp-cache
        if: steps.image.outputs.hit != 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        with:
          aws-access-key-id: ${{ secrets.WARP_CACHE_AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.WARP_CACHE_AWS_SECRET_ACCESS_KEY }}
          signature-key: ${{ secrets.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}
          role-arn: ${{ vars.WARP_CACHE_ROLE_ARN }}
          bucket: ${{ vars.WARP_CACHE_BUCKET }}

      - name: Set up Docker Buildx
        if: steps.image.outputs.hit != 'true'
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/metorial/ares
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Prune Docker workspace
        id: prune
        if: steps.image.outputs.hit != 'true'
        uses: ./.github/actions/prune-docker
        with:
          dockerfile: ./src/ares/service/Dockerfile

      - name: Cache Docker dependencies
        if: steps.image.outputs.hit != 'true' && steps.prune.outputs.pruned == 'true' && steps.prune.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: pruned=${{ steps.prune.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          target: dependencies
          push: false
          cache-to: type=local,mode=max,dest=${{ steps.prune.outputs.cache-path }}/layers

      - name: Save Docker dependency cache
        if: steps.image.outputs.hit != 'true' && steps.prune.outputs.pruned == 'true' && steps.prune.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.prune.outputs.cache-path }}
          key: ${{ steps.prune.outputs.cache-key }}

      - name: Build and push Docker image
        if: steps.image.outputs.hit != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: pruned=${{ steps.prune.outputs.context }}
          file: ${{ steps.image.outputs.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          cache-from: ${{ steps.prune.outputs.pruned == 'true' && format('type=local,src={0}/layers', steps.prune.outputs.cache-path) || format('type=gha,scope={0}-{1}-{2}', github.workflow, github.job, 'image') }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/metorial/ares:${{ steps.image.outputs.tag }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}
            TURBO_API=http://127.0.0.1:8787
            TURBO_TEAM=metorial
          secrets: |
            turbo_token=${{ env.TURBO_TOKEN }}
            turbo_signature=${{ env.TURBO_REMOTE_CACHE_SIGNATURE_KEY }}

      - name: Publish reused image aliases
        if: steps.image.outputs.hit == 'true' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          SOURCE: ${{ steps.image.outputs.source }}
          TAGS: ${{ steps.meta.outputs.tags }}
          CACHE_IMAGE: ghcr.io/metorial/ares:${{ steps.image.outputs.tag }}
        run: bun src/tooling/docker-build/image-cache.ts copy "$SOURCE" "$TAGS $CACHE_IMAGE"

      - name: Report Warp Cache
        if: always() && steps.image.outputs.hit != 'true'
        run: sh ./src/tooling/warp-cache/report.sh

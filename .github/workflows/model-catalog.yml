name: 'Model Catalog'

# Every 15 minutes: fetch every source once, let a pi agent on Workers AI decide the open catalog issues as
# override entries, merge those decisions as one PR, then generate the published catalog from the
# merged overrides and the same source snapshots. With no open issues, no agent runs. The catalog is
# served from models.metorial.com (a Worker with static assets) and only redeployed when its
# content differs from what the site serves now and it passes the deploy gate (a previous catalog
# exists, and prices, live offerings and price outliers didn't move too much). A failed gate fails
# the run without deploying; dispatch with allow-unsafe to deploy anyway.
# The GitHub App pushes each batch so a cancelled run can resume its work, and opens the PR.
# The repository's reviewer token approves and squash-merges the tested commit into dev.

on:
  workflow_dispatch:
    inputs:
      allow-unsafe:
        description: 'Deploy even when the deploy gate fails (no previous catalog, mass price change, offering drop or many new price outliers)'
        type: boolean
        default: false
  schedule:
    - cron: '2,17,32,47 * * * *'

concurrency:
  group: model-catalog
  cancel-in-progress: false

permissions:
  contents: read

env:
  PACKAGE_DIR: src/products/agents/data/models
  PREVIOUS_DIR: ${{ github.workspace }}/model-catalog-previous
  WORK_DIR: ${{ github.workspace }}/model-catalog-work
  PI_VERSION: '1.5.2'
  WRANGLER_VERSION: '4.160.1'
  SITE_URL: https://models.metorial.com
  BRANCH: model-catalog/overrides
  GIT_AUTHOR_NAME: 'metorial-model-catalog[bot]'
  GIT_AUTHOR_EMAIL: '361062840+metorial-model-catalog[bot]@users.noreply.github.com'
  GIT_COMMITTER_NAME: 'metorial-model-catalog[bot]'
  GIT_COMMITTER_EMAIL: '361062840+metorial-model-catalog[bot]@users.noreply.github.com'
  # Scheduled runs are always on the default branch; their event payload has no repository.
  IS_DEFAULT_BRANCH: ${{ github.ref == 'refs/heads/dev' && (github.event_name == 'schedule' || github.event.repository.default_branch == 'dev') }}

jobs:
  generate:
    name: Generate model catalog
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Bun validates the workspace graph even for a filtered install.
      - name: Checkout submodule workspaces
        run: git submodule update --init --depth 1 -- src/products/outpost/implementation clients/metorial-node

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: bun install --filter '@metorial/model-catalog'

      # pi's grep tool shells out to ripgrep, and the agent runs offline so it can't fetch it.
      - name: Install pi and ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends ripgrep bubblewrap
          npm install -g --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$PI_VERSION"

      - name: Run unit tests
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bun run test

      # The previous run's catalog carries IDs, first-seen times and name/pointer history forward,
      # and its source snapshots are the fallback when a live source is down.
      - name: Restore previous catalog
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PREVIOUS_DIR }}
          key: model-catalog-${{ github.run_id }}
          restore-keys: model-catalog-

      # On a cache miss the deployed catalog is the previous one (without source snapshots). If the
      # site is unreachable too, the run has no previous catalog and the deploy gate stops it.
      - name: Restore previous catalog from the live site
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bun run restore-previous --previous "$PREVIOUS_DIR" --live-url "$SITE_URL"

      - name: Create model catalog app token
        id: app
        if: env.IS_DEFAULT_BRANCH == 'true'
        continue-on-error: true
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ secrets.MODEL_CATALOG_APP_CLIENT_ID }}
          private-key: ${{ secrets.MODEL_CATALOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Reconcile overrides and pricing sources
        id: reconcile
        if: env.IS_DEFAULT_BRANCH != 'true' || steps.app.outcome == 'success'
        continue-on-error: true
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          CLOUDFLARE_AI_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          args=(--work "$WORK_DIR" --cache-dir .cache)
          if [ -f "$PREVIOUS_DIR/catalog.json" ]; then args+=(--previous "$PREVIOUS_DIR"); fi
          if [ "$IS_DEFAULT_BRANCH" = 'true' ]; then
            args+=(--branch "$BRANCH")
            export GIT_CONFIG_COUNT=1
            export GIT_CONFIG_KEY_0="url.https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.insteadOf"
            export GIT_CONFIG_VALUE_0="https://github.com/${GITHUB_REPOSITORY}"
          fi
          bun run reconcile "${args[@]}"

      - name: Test reconciled overrides and sources
        id: verify
        if: steps.reconcile.outcome == 'success' && steps.reconcile.outputs.changed == 'true'
        continue-on-error: true
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          bun run typecheck
          bun run test

      - name: Publish override pull request as the app
        id: publish
        if: steps.verify.outcome == 'success' && env.IS_DEFAULT_BRANCH == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app.outputs.token }}@github.com/${{ github.repository }}.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/${{ github.repository }}
          TITLE: 'Model catalog: reconcile overrides and pricing sources'
        run: |
          pulls="repos/$GITHUB_REPOSITORY/pulls"
          open_pr="$(gh api --method GET "$pulls" -f state=open -f base="$GITHUB_REF_NAME" \
            -f head="$GITHUB_REPOSITORY_OWNER:$BRANCH" --jq '.[0] // empty')"
          if [ -n "$open_pr" ] && [ "$(jq -r .user.login <<< "$open_pr")" != "$GIT_AUTHOR_NAME" ]; then
            echo '::error::The model catalog branch already has an open PR from another author.'
            exit 1
          fi

          # Reconcile has already committed and pushed each batch; this only covers changes it
          # could not commit itself and makes sure origin has the final state.
          git checkout -B "$BRANCH"
          git add -A -- "$PACKAGE_DIR/overrides"
          if [ -f "$WORK_DIR/source-repairs.json" ]; then
            (cd "$PACKAGE_DIR" && bun src/reconcile/stageRepairs.ts "$WORK_DIR/source-repairs.json")
          fi
          if ! git diff --cached --quiet; then
            git commit -q -m "$TITLE" -m "From ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
          head_sha="$(git rev-parse HEAD)"
          git push -q --force origin "$head_sha:refs/heads/$BRANCH"

          body="$(head -c 60000 "$WORK_DIR/summary.md")"
          if [ -z "$open_pr" ]; then
            number="$(gh api --method POST "$pulls" -f base="$GITHUB_REF_NAME" -f head="$BRANCH" \
              -f title="$TITLE" -f body="$body" --jq .number)"
          else
            number="$(jq -r .number <<< "$open_pr")"
            gh api --method PATCH "$pulls/$number" -f title="$TITLE" -f body="$body" --silent
          fi
          echo "number=$number" >> "$GITHUB_OUTPUT"
          echo "head=$head_sha" >> "$GITHUB_OUTPUT"

      - name: Approve and squash-merge as the reviewer
        id: merge
        if: steps.publish.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.MODEL_CATALOG_REVIEW_TOKEN }}
          PR_NUMBER: ${{ steps.publish.outputs.number }}
          PR_HEAD: ${{ steps.publish.outputs.head }}
        run: |
          pr="repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER"
          review="$(gh api --method POST "$pr/reviews" -f event=APPROVE -f commit_id="$PR_HEAD" --jq .state)"
          test "$review" = APPROVED

          merged="$(gh api --method PUT "$pr/merge" -f sha="$PR_HEAD" -f merge_method=squash --jq 'select(.merged).sha')"
          test -n "$merged"
          echo "sha=$merged" >> "$GITHUB_OUTPUT"

      # A failed test must not leave its decisions for the next run to resume.
      - name: Delete merged or failed overrides branch
        if: env.IS_DEFAULT_BRANCH == 'true' && (steps.verify.outcome == 'failure' || steps.merge.outcome == 'success')
        continue-on-error: true
        env:
          GIT_CONFIG_COUNT: '1'
          GIT_CONFIG_KEY_0: url.https://x-access-token:${{ steps.app.outputs.token }}@github.com/${{ github.repository }}.insteadOf
          GIT_CONFIG_VALUE_0: https://github.com/${{ github.repository }}
        run: git push -q origin --delete "$BRANCH" || true

      - name: Checkout merged overrides
        if: steps.merge.outcome == 'success'
        env:
          MERGE_SHA: ${{ steps.merge.outputs.sha }}
        run: |
          git fetch --no-tags --depth 1 origin "$MERGE_SHA"
          git checkout -qf "$MERGE_SHA"

      # The published catalog must match what is on the default branch, so decisions that didn't
      # merge are dropped before generating. Reconcile leaves the checkout on the overrides branch.
      - name: Discard unmerged overrides
        if: steps.merge.outcome != 'success'
        run: |
          git checkout -qf "$GITHUB_SHA"
          git clean -fdq -- "$PACKAGE_DIR/overrides"

      # Sets the `deploy` output from the deploy gate; a failed gate doesn't fail this step so the
      # report, artifacts and the final failure step still run.
      - name: Generate catalog
        id: generate
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          ALLOW_UNSAFE: ${{ inputs.allow-unsafe == true }}
        run: |
          args=(--out out --cache-dir .cache)
          if [ -f "$PREVIOUS_DIR/catalog.json" ]; then args+=(--previous "$PREVIOUS_DIR"); fi
          if [ -f "$WORK_DIR/pinned/catalog.json" ]; then
            args+=(--sources "$WORK_DIR/pinned" --models-dev .cache/models.dev)
          fi
          if [ "$ALLOW_UNSAFE" = 'true' ]; then args+=(--allow-unsafe); fi
          bun run generate "${args[@]}"

      - name: Build site
        id: site
        continue-on-error: true
        working-directory: ${{ env.PACKAGE_DIR }}
        run: bun run site --out out --site site --live-url "$SITE_URL"

      - name: Deploy site
        id: deploy
        if: steps.generate.outputs.deploy == 'true' && steps.site.outcome == 'success' && steps.site.outputs.changed == 'true' && env.IS_DEFAULT_BRANCH == 'true'
        continue-on-error: true
        working-directory: ${{ env.PACKAGE_DIR }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_AI_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" deploy

      - name: Publish report
        if: always()
        working-directory: ${{ env.PACKAGE_DIR }}
        run: |
          if [ -f "$WORK_DIR/summary.md" ]; then cat "$WORK_DIR/summary.md" >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f out/report.md ]; then cat out/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Upload catalog
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-catalog-${{ github.run_id }}
          path: ${{ env.PACKAGE_DIR }}/out
          if-no-files-found: ignore
          retention-days: 7

      # Batches, agent logs and pi sessions, scrubbed of credentials by the reconcile step.
      - name: Upload reconcile logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-catalog-reconcile-${{ github.run_id }}
          path: |
            ${{ env.WORK_DIR }}
            !${{ env.WORK_DIR }}/pinned
          if-no-files-found: ignore
          retention-days: 14

      # A catalog that failed the gate must not become the next run's previous catalog, or the next
      # run would compare against it, pass, and deploy it.
      - name: Keep catalog for the next run
        if: steps.generate.outputs.deploy == 'true'
        run: |
          rm -rf "$PREVIOUS_DIR"
          mkdir -p "$PREVIOUS_DIR"
          cp "$PACKAGE_DIR/out/catalog.json" "$PREVIOUS_DIR/"
          cp -r "$PACKAGE_DIR/out/sources" "$PREVIOUS_DIR/"

      - name: Save catalog for the next run
        if: steps.generate.outputs.deploy == 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PREVIOUS_DIR }}
          key: model-catalog-${{ github.run_id }}

      - name: Fail on reconcile errors
        if: steps.app.outcome == 'failure' || steps.reconcile.outcome == 'failure' || steps.verify.outcome == 'failure' || steps.publish.outcome == 'failure' || steps.merge.outcome == 'failure' || steps.site.outcome == 'failure' || steps.deploy.outcome == 'failure'
        run: |
          echo "::error::app=${{ steps.app.outcome }} reconcile=${{ steps.reconcile.outcome }} verify=${{ steps.verify.outcome }} publish=${{ steps.publish.outcome }} merge=${{ steps.merge.outcome }} site=${{ steps.site.outcome }} deploy=${{ steps.deploy.outcome }}; the catalog was still generated from the default branch's overrides"
          exit 1

      - name: Fail on deploy gate
        if: ${{ !cancelled() && steps.generate.outputs.deploy == 'false' }}
        run: |
          echo "::error title=Deploy gate::The catalog was not deployed or kept for the next run because the deploy gate failed; see the Deploy gate section of the run summary. Re-run the workflow on the default branch with allow-unsafe once the changes are confirmed."
          exit 1

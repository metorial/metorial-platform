name: 'Conduit Integration'

on:
  workflow_dispatch:
  push:
    branches: [dev]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  changes:
    name: Detect affected tests
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.changes.outputs.units }}
      unit-tasks: ${{ steps.changes.outputs.unit-tasks }}
      e2e: ${{ steps.changes.outputs.e2e }}
      matrix: ${{ steps.changes.outputs.matrix }}
      conduit: ${{ steps.changes.outputs.conduit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          token: ${{ secrets.GH_TOKEN || github.token }}
      - uses: ./.github/actions/detect-test-changes
        id: changes
        with:
          tasks: test --filter=./src/metorial/packages/* --filter=./src/metorial/products/** --filter=./src/lowerdeck/** --filter=@metorial/nebula --filter=@metorial/function-bay --filter=@metorial/shuttle --filter=@metorial/slates --filter=@metorial/relay

  conduit-integration:
    needs: changes
    if: needs.changes.outputs.conduit == 'true'
    name: 'Conduit Integration (Redis + NATS)'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: 'recursive'
          token: ${{ secrets.GH_TOKEN }}

      - uses: ./.github/actions/setup-test-workspace
        id: tests
        with:
          tasks: test:integration --filter=@metorial-subspace/conduit

      - name: Run conduit integration tests
        working-directory: ${{ steps.tests.outputs.workspace }}
        run: bunx turbo@2.9.18 run test:integration --filter=@metorial-subspace/conduit --ui=stream

name: Reusable Control

on:
  workflow_call:
    inputs:
      command:
        description: 'Control command: build, ci, or warm-cache'
        required: true
        type: string
      mode:
        description: 'Test mode (e2e or unit) when command is ci'
        required: false
        type: string
      filter:
        description: 'Service name to pass to --filter'
        required: false
        type: string
      all:
        description: 'Pass --all to control'
        required: false
        default: false
        type: boolean
      project_prefix:
        description: 'Optional docker compose project prefix for ci'
        required: false
        type: string
      modules:
        description: 'Optional module selector(s) to pass to control e2e'
        required: false
        default: ''
        type: string
      runs-on:
        description: 'Runner label'
        required: false
        default: ubuntu-latest
        type: string
      checkout_submodules:
        description: 'Whether to checkout submodules recursively'
        required: false
        default: false
        type: boolean
      enable_cache:
        description: 'Enable the Nx GitHub Actions cache bridge'
        required: false
        default: true
        type: boolean
      cache_prefix:
        description: 'Optional cache scope override'
        required: false
        default: ''
        type: string
      cache_write_mode:
        description: 'Nx cache write policy: auto, warm-cache, trusted, always, or never'
        required: false
        default: auto
        type: string
      image:
        description: 'Image repository for control build'
        required: false
        default: ''
        type: string
      image_tag:
        description: 'Image tag for control build; defaults to sanitized branch name plus commit SHA'
        required: false
        default: ''
        type: string
      push_image:
        description: 'Push built images'
        required: false
        default: false
        type: boolean
      target_role:
        description: 'Control build target role: service or test-runner'
        required: false
        default: service
        type: string
      build_test_runner:
        description: 'Also build a test-runner image for e2e artifact reuse'
        required: false
        default: false
        type: boolean
      save_image_artifact:
        description: 'Save built images as a Docker archive artifact'
        required: false
        default: false
        type: boolean
      image_artifact_name:
        description: 'Artifact name for saved Docker image archive'
        required: false
        default: ''
        type: string
      download_image_artifacts:
        description: 'Download Docker image archive artifacts before running control'
        required: false
        default: false
        type: boolean
      image_artifact_pattern:
        description: 'Artifact name pattern for Docker image archives'
        required: false
        default: ''
        type: string
      prebuilt_images:
        description: 'Run e2e compose with prebuilt control images'
        required: false
        default: false
        type: boolean
      prebuilt_image_prefix:
        description: 'Image prefix used by prebuilt e2e compose'
        required: false
        default: control
        type: string

jobs:
  control:
    name: Control ${{ inputs.command }} ${{ inputs.filter }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: write
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.checkout_submodules && 'recursive' || 'false' }}
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      - name: Compute cache scope
        id: cache-scope
        if: ${{ inputs.enable_cache }}
        env:
          CACHE_PREFIX: ${{ inputs.cache_prefix }}
          CACHE_NAMESPACE: control-v1-${{ runner.os }}-${{ hashFiles('bun.lock', 'package.json', 'nx.json') }}
          CACHE_REF: ${{ github.ref_name }}
          COMMAND: ${{ inputs.command }}
          MODE: ${{ inputs.mode }}
          FILTER: ${{ inputs.filter }}
          ALL: ${{ inputs.all }}
          MODULES: ${{ inputs.modules }}
          CACHE_WRITE_MODE: ${{ inputs.cache_write_mode }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          set -euo pipefail

          PREFIX="${CACHE_PREFIX:-control}"
          if [ "${COMMAND}" = "warm-cache" ]; then
            SCOPE="${PREFIX}-warm-cache"
          elif [ "${ALL}" = "true" ]; then
            SCOPE="${PREFIX}-${COMMAND}-${MODE:-none}-all"
          elif [ -n "${FILTER}" ]; then
            SCOPE="${PREFIX}-${COMMAND}-${MODE:-none}-${FILTER}"
          else
            SCOPE="${PREFIX}-${COMMAND}-${MODE:-none}-none"
          fi
          if [ -n "${MODULES}" ]; then
            SCOPE="${SCOPE}-modules-${MODULES}"
          fi

          SCOPE="$(printf '%s' "${SCOPE}" | tr -c 'A-Za-z0-9_.-' '-')"
          CACHE_REF_SAFE="$(printf '%s' "${CACHE_REF}" | tr -c 'A-Za-z0-9_.-' '-')"
          WARM_SCOPE="$(printf '%s' "${PREFIX}-warm-cache" | tr -c 'A-Za-z0-9_.-' '-')"
          ARTIFACT_PREFIX="control-nx-artifacts-${CACHE_NAMESPACE}-${CACHE_REF_SAFE}-${SCOPE}"
          WARM_ARTIFACT_PREFIX="control-nx-artifacts-${CACHE_NAMESPACE}-${CACHE_REF_SAFE}-${WARM_SCOPE}"
          CACHE_UPLOADS="false"

          case "${CACHE_WRITE_MODE}" in
            auto)
              if [ "${COMMAND}" = "warm-cache" ]; then
                CACHE_UPLOADS="true"
              elif [ "${EVENT_NAME}" != "pull_request" ] && [ "${CACHE_REF}" = "${DEFAULT_BRANCH}" ]; then
                CACHE_UPLOADS="true"
              fi
              ;;
            warm-cache)
              if [ "${COMMAND}" = "warm-cache" ]; then
                CACHE_UPLOADS="true"
              fi
              ;;
            trusted)
              if [ "${IS_FORK_PR}" != "true" ]; then
                CACHE_UPLOADS="true"
              fi
              ;;
            always)
              CACHE_UPLOADS="true"
              ;;
            never)
              CACHE_UPLOADS="false"
              ;;
            *)
              echo "Unsupported cache_write_mode: ${CACHE_WRITE_MODE}" >&2
              exit 1
              ;;
          esac

          echo "scope=${SCOPE}" >> "${GITHUB_OUTPUT}"
          echo "warm_scope=${WARM_SCOPE}" >> "${GITHUB_OUTPUT}"
          echo "namespace=${CACHE_NAMESPACE}" >> "${GITHUB_OUTPUT}"
          echo "ref_safe=${CACHE_REF_SAFE}" >> "${GITHUB_OUTPUT}"
          echo "cache_uploads=${CACHE_UPLOADS}" >> "${GITHUB_OUTPUT}"
          echo "artifact_save_key=${ARTIFACT_PREFIX}-${{ github.run_id }}-${{ github.run_attempt }}" >> "${GITHUB_OUTPUT}"
          {
            echo "artifact_restore_keys<<EOF"
            echo "${ARTIFACT_PREFIX}-"
            echo "${WARM_ARTIFACT_PREFIX}-"
            echo "control-nx-artifacts-${CACHE_NAMESPACE}-${CACHE_REF_SAFE}-"
            echo "control-nx-artifacts-${CACHE_NAMESPACE}-"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: Prepare cache directories
        if: ${{ inputs.enable_cache }}
        run: mkdir -p .nx/cache .control/cache/nx-artifacts .control/cache/nx-manifest

      - name: Restore Nx artifact directory
        if: ${{ inputs.enable_cache }}
        uses: actions/cache/restore@v4
        with:
          path: .control/cache/nx-artifacts
          key: ${{ steps.cache-scope.outputs.artifact_save_key }}
          restore-keys: ${{ steps.cache-scope.outputs.artifact_restore_keys }}

      - name: Install packages
        env:
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
        run: bun i

      - name: Compute image tag
        id: image-tag
        env:
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
          RAW_REF: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_IMAGE_TAG}" ]; then
            TAG="${INPUT_IMAGE_TAG}"
          else
            SAFE_REF="$(printf '%s' "${RAW_REF}" | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9_.-' '-' | sed -E 's/^-+//; s/-+$//; s/-+/-/g' | cut -c1-80)"
            TAG="${SAFE_REF}-${{ github.sha }}"
          fi

          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"

      - name: Download prebuilt image artifacts
        if: ${{ inputs.download_image_artifacts }}
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_PATTERN: ${{ inputs.image_artifact_pattern }}
          FILTER: ${{ inputs.filter }}
        run: |
          set -euo pipefail

          mkdir -p .control/prebuilt-images

          if [ "${ARTIFACT_PATTERN}" != "control-image-*" ]; then
            gh run download "${{ github.run_id }}" \
              --pattern "${ARTIFACT_PATTERN}" \
              --dir .control/prebuilt-images
            exit 0
          fi

          if [ -z "${FILTER}" ]; then
            echo "filter is required to resolve prebuilt image artifacts" >&2
            exit 1
          fi

          GRAPH_FILE=".control/prebuilt-images/graph.json"
          ARTIFACTS_FILE=".control/prebuilt-images/artifacts.txt"

          bun run control graph "${FILTER}" > "${GRAPH_FILE}"
          bun -e '
            let graph = JSON.parse(await Bun.file(process.argv.at(-1)).text());
            let names = new Set();
            let visit = graph => {
              names.add(graph.name);
              for (let dep of graph.deps ?? []) {
                if (dep.kind === "control" && dep.children) visit(dep.children);
              }
            };
            visit(graph);
            console.log([...names].sort().join("\n"));
          ' "${GRAPH_FILE}" > "${ARTIFACTS_FILE}"

          while IFS= read -r service; do
            if [ -z "${service}" ]; then
              continue
            fi
            gh run download "${{ github.run_id }}" \
              --name "control-image-${service}" \
              --dir .control/prebuilt-images
          done < "${ARTIFACTS_FILE}"

      - name: Load prebuilt images
        if: ${{ inputs.download_image_artifacts }}
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          archives=(.control/prebuilt-images/**/*.tar)
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "No prebuilt image archives found" >&2
            exit 1
          fi
          for archive in "${archives[@]}"; do
            docker load -i "${archive}"
          done

      - name: Log in to GitHub Container Registry
        if: ${{ inputs.command == 'build' && inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Expose GitHub Actions cache runtime
        if: ${{ inputs.enable_cache }}
        uses: crazy-max/ghaction-github-runtime@v3

      - name: Start Nx cache bridge
        if: ${{ inputs.enable_cache }}
        env:
          CACHE_NAMESPACE: ${{ steps.cache-scope.outputs.namespace }}
          CACHE_SCOPE: ${{ steps.cache-scope.outputs.scope }}
          CACHE_WARM_SCOPE: ${{ steps.cache-scope.outputs.warm_scope }}
          CACHE_REF_SAFE: ${{ steps.cache-scope.outputs.ref_safe }}
          CACHE_UPLOADS: ${{ steps.cache-scope.outputs.cache_uploads }}
        run: |
          set -euo pipefail

          PORT=43191
          SERVER_URL="http://127.0.0.1:${PORT}"
          MANIFEST_PREFIX="control-nx-used-digests-${CACHE_NAMESPACE}-${CACHE_REF_SAFE}-${CACHE_SCOPE}"
          MANIFEST_SAVE_KEY="${MANIFEST_PREFIX}-${{ github.run_id }}-${{ github.run_attempt }}"
          WARM_MANIFEST_PREFIX="control-nx-used-digests-${CACHE_NAMESPACE}-${CACHE_REF_SAFE}-${CACHE_WARM_SCOPE}"
          UPLOAD_ARGS=()
          if [ "${CACHE_UPLOADS}" != "true" ]; then
            UPLOAD_ARGS+=(--disable-github-uploads)
          fi

          echo "Nx cache uploads enabled: ${CACHE_UPLOADS}"

          bun run control cache-server \
            --port "${PORT}" \
            --host "0.0.0.0" \
            --namespace "${CACHE_NAMESPACE}" \
            --root ".control/cache/nx-artifacts" \
            --manifest-dir ".control/cache/nx-manifest" \
            --stats ".control/cache/nx-stats.json" \
            --ready-file ".control/cache/nx-server.ready" \
            --manifest-save-key "${MANIFEST_SAVE_KEY}" \
            --manifest-primary-key "${MANIFEST_SAVE_KEY}" \
            --manifest-restore-key "${MANIFEST_PREFIX}-" \
            --manifest-restore-key "${WARM_MANIFEST_PREFIX}-" \
            --manifest-restore-key "control-nx-used-digests-${CACHE_NAMESPACE}-${CACHE_REF_SAFE}-" \
            --manifest-restore-key "control-nx-used-digests-${CACHE_NAMESPACE}-" \
            "${UPLOAD_ARGS[@]}" \
            > .control/cache/nx-server.log 2>&1 &

          echo "$!" > .control/cache/nx-server.pid
          for attempt in $(seq 1 30); do
            if [ -f .control/cache/nx-server.ready ]; then
              echo "server=${SERVER_URL}" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            sleep 1
          done

          echo "Nx cache bridge did not become ready" >&2
          if [ -f .control/cache/nx-server.log ]; then
            cat .control/cache/nx-server.log >&2
          fi
          exit 1

      - name: Warm shared build cache
        if: ${{ inputs.command == 'warm-cache' }}
        env:
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ inputs.enable_cache && 'http://127.0.0.1:43191' || '' }}
        run: bun run control warm-cache --all --include-unit

      - name: Prepare unit cache closure
        if: ${{ inputs.command == 'ci' && inputs.mode == 'unit' }}
        env:
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ inputs.enable_cache && 'http://127.0.0.1:43191' || '' }}
        run: bun run control warm-cache --filter "${{ inputs.filter }}" --include-unit

      - name: Run control
        if: ${{ inputs.command != 'warm-cache' }}
        env:
          CONTROL_BUILDKIT_CACHE: '0'
          CONTROL_DOCKER_CACHE_MOUNTS: '0'
          CONTROL_NO_STAGE: '1'
          CONTROL_PREBUILT_BUILD_ARTIFACTS: ${{ inputs.prebuilt_images && '0' || '1' }}
          CONTROL_PREBUILT_IMAGES: ${{ inputs.prebuilt_images && '1' || '0' }}
          CONTROL_PREBUILT_IMAGE_PREFIX: ${{ inputs.prebuilt_image_prefix }}
          CONTROL_PREBUILT_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          CONTROL_NX_REMOTE_CACHE_DOCKER_URL: ${{ inputs.enable_cache && 'http://host.docker.internal:43191' || '' }}
          CONTROL_VERBOSE: '1'
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
          NX_SELF_HOSTED_REMOTE_CACHE_SERVER: ${{ inputs.enable_cache && 'http://127.0.0.1:43191' || '' }}
          CONTROL_IMAGE: ${{ inputs.image }}
          CONTROL_IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
          CONTROL_PUSH_IMAGE: ${{ inputs.push_image && '1' || '0' }}
          CONTROL_TARGET_ROLE: ${{ inputs.target_role }}
          CONTROL_BUILD_TEST_RUNNER: ${{ inputs.build_test_runner && '1' || '0' }}
        run: |
          set -euo pipefail

          add_selection_args() {
            if [ "${{ inputs.all }}" = "true" ]; then
              ARGS+=(--all)
            elif [ -n "${{ inputs.filter }}" ]; then
              ARGS+=(--filter "${{ inputs.filter }}")
            fi
          }

          add_build_image_args() {
            if [ -n "${CONTROL_IMAGE}" ]; then
              ARGS+=(--image "${CONTROL_IMAGE}")
            fi
            if [ -n "${CONTROL_IMAGE_TAG}" ]; then
              ARGS+=(--tag "${CONTROL_IMAGE_TAG}")
            fi
            if [ "${CONTROL_PUSH_IMAGE}" = "1" ]; then
              ARGS+=(--push)
            fi
          }

          if [ "${{ inputs.command }}" = "build" ]; then
            ARGS=(build --target-role "${CONTROL_TARGET_ROLE}")
            add_selection_args
            add_build_image_args
            bun run control "${ARGS[@]}"

            if [ "${CONTROL_BUILD_TEST_RUNNER}" = "1" ]; then
              if [ -z "${CONTROL_IMAGE}" ]; then
                echo "image is required when build_test_runner is true" >&2
                exit 1
              fi
              ARGS=(build --target-role test-runner)
              add_selection_args
              CONTROL_IMAGE="${{ inputs.image }}-test"
              add_build_image_args
              bun run control "${ARGS[@]}"
            fi
          elif [ "${{ inputs.command }}" = "ci" ]; then
            if [ -z "${{ inputs.mode }}" ]; then
              echo "mode is required when command is ci" >&2
              exit 1
            fi
            ARGS=(ci "${{ inputs.mode }}")
            add_selection_args
            if [ -n "${{ inputs.project_prefix }}" ]; then
              ARGS+=(--project-prefix "${{ inputs.project_prefix }}")
            fi
            if [ "${{ inputs.mode }}" = "e2e" ] && [ -n "${{ inputs.modules }}" ]; then
              ARGS+=(--module "${{ inputs.modules }}")
            fi
          elif [ "${{ inputs.command }}" = "warm-cache" ]; then
            exit 0
          else
            echo "Unsupported command: ${{ inputs.command }}" >&2
            exit 1
          fi

          if [ "${{ inputs.command }}" != "build" ]; then
            bun run control "${ARGS[@]}"
          fi

      - name: Save image archive
        if: ${{ inputs.save_image_artifact }}
        env:
          SERVICE: ${{ inputs.filter }}
          IMAGE: ${{ inputs.image }}
          IMAGE_TAG: ${{ steps.image-tag.outputs.tag }}
        run: |
          set -euo pipefail

          if [ -z "${SERVICE}" ] || [ -z "${IMAGE}" ] || [ -z "${IMAGE_TAG}" ]; then
            echo "filter, image, and image tag are required to save image artifacts" >&2
            exit 1
          fi

          mkdir -p .control/image-artifacts
          docker tag "${IMAGE}:${IMAGE_TAG}" "control/${SERVICE}:${IMAGE_TAG}"
          docker tag "${IMAGE}-test:${IMAGE_TAG}" "control/${SERVICE}-test:${IMAGE_TAG}"
          docker save \
            -o ".control/image-artifacts/${SERVICE}.tar" \
            "control/${SERVICE}:${IMAGE_TAG}" \
            "control/${SERVICE}-test:${IMAGE_TAG}"

      - name: Upload image archive
        if: ${{ inputs.save_image_artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.image_artifact_name || format('control-image-{0}', inputs.filter) }}
          path: .control/image-artifacts/*.tar
          retention-days: 1

      - name: Finalize Nx cache bridge
        if: ${{ always() && inputs.enable_cache }}
        run: |
          set +e

          FINALIZE_STATUS=0
          SUMMARY_STATUS=0

          if [ -f .control/cache/nx-server.pid ]; then
            bun run control cache-finalize --server "http://127.0.0.1:43191"
            FINALIZE_STATUS=$?
          fi

          SUMMARY_OUTPUT="$(bun run control cache-summary \
            --stats ".control/cache/nx-stats.json" \
            --root ".control/cache/nx-artifacts")"
          SUMMARY_STATUS=$?
          echo "${SUMMARY_OUTPUT}"

          if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
            {
              echo "## Nx cache summary"
              echo ""
              echo '```'
              echo "${SUMMARY_OUTPUT}"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY}"
          fi

          if [ "${FINALIZE_STATUS}" -ne 0 ] || [ "${SUMMARY_STATUS}" -ne 0 ]; then
            echo ""
            echo "Nx cache bridge log"
            if [ -f .control/cache/nx-server.log ]; then
              cat .control/cache/nx-server.log
            else
              echo "No Nx cache bridge log found"
            fi
          fi

          if [ -f .control/cache/nx-server.pid ]; then
            kill "$(cat .control/cache/nx-server.pid)" 2>/dev/null || true
          fi

          if [ "${FINALIZE_STATUS}" -ne 0 ]; then
            echo "::warning::Nx cache bridge finalize failed with status ${FINALIZE_STATUS}; continuing because cache upload is best-effort"
          fi
          if [ "${SUMMARY_STATUS}" -ne 0 ]; then
            echo "::warning::Nx cache bridge summary failed with status ${SUMMARY_STATUS}; continuing because cache reporting is best-effort"
          fi

      - name: Save warmed Nx artifact directory
        if: ${{ always() && inputs.enable_cache && inputs.command == 'warm-cache' }}
        uses: actions/cache/save@v4
        with:
          path: .control/cache/nx-artifacts
          key: ${{ steps.cache-scope.outputs.artifact_save_key }}

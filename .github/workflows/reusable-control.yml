name: Reusable Control

on:
  workflow_call:
    inputs:
      command:
        description: 'Control command: build or ci'
        required: true
        type: string
      mode:
        description: 'Test mode (e2e or unit) when command is ci'
        required: false
        type: string
      filter:
        description: 'Service name to pass to --filter'
        required: false
        type: string
      all:
        description: 'Pass --all to control'
        required: false
        default: false
        type: boolean
      project_prefix:
        description: 'Optional docker compose project prefix for ci'
        required: false
        type: string
      modules:
        description: 'Optional module selector(s) to pass to control e2e'
        required: false
        default: ''
        type: string
      runs-on:
        description: 'Runner label'
        required: false
        default: depot-ubuntu-24.04-4
        type: string
      checkout_submodules:
        description: 'Whether to checkout submodules recursively'
        required: false
        default: false
        type: boolean
      enable_cache:
        description: 'Restore and save Nx/BuildKit caches'
        required: false
        default: true
        type: boolean
      cache_prefix:
        description: 'Optional cache scope override'
        required: false
        default: ''
        type: string

jobs:
  control:
    name: Control ${{ inputs.command }} ${{ inputs.filter }}
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      packages: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: ${{ inputs.checkout_submodules && 'recursive' || 'false' }}
          token: ${{ secrets.GH_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.2.20'

      - name: Set up Docker Buildx
        id: buildx
        if: ${{ inputs.enable_cache && (inputs.command == 'build' || (inputs.command == 'ci' && inputs.mode == 'e2e')) }}
        uses: docker/setup-buildx-action@v3
        with:
          install: true

      - name: Compute cache scope
        id: cache-scope
        if: ${{ inputs.enable_cache }}
        env:
          CACHE_PREFIX: ${{ inputs.cache_prefix }}
          COMMAND: ${{ inputs.command }}
          MODE: ${{ inputs.mode }}
          FILTER: ${{ inputs.filter }}
          ALL: ${{ inputs.all }}
          MODULES: ${{ inputs.modules }}
        run: |
          set -euo pipefail

          if [ -n "${CACHE_PREFIX}" ]; then
            SCOPE="${CACHE_PREFIX}"
          elif [ "${ALL}" = "true" ]; then
            SCOPE="${COMMAND}-${MODE:-none}-all"
          elif [ -n "${FILTER}" ]; then
            SCOPE="${COMMAND}-${MODE:-none}-${FILTER}"
          else
            SCOPE="${COMMAND}-${MODE:-none}-none"
          fi
          if [ -n "${MODULES}" ]; then
            SCOPE="${SCOPE}-modules-${MODULES}"
          fi

          SCOPE="$(printf '%s' "${SCOPE}" | tr -c 'A-Za-z0-9_.-' '-')"
          echo "scope=${SCOPE}" >> "${GITHUB_OUTPUT}"

      - name: Prepare cache directories
        if: ${{ inputs.enable_cache }}
        run: mkdir -p .nx/cache .control/cache/buildkit

      - name: Restore Nx cache
        if: ${{ inputs.enable_cache }}
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: control-nx-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache-scope.outputs.scope }}-${{ hashFiles('bun.lock', 'package.json', 'nx.json', 'src/tooling/control/package.json', 'src/tooling/control/src/**/*.ts') }}
          restore-keys: |
            control-nx-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache-scope.outputs.scope }}-
            control-nx-${{ runner.os }}-${{ github.ref_name }}-
            control-nx-${{ runner.os }}-

      - name: Restore BuildKit cache
        if: ${{ inputs.enable_cache && (inputs.command == 'build' || (inputs.command == 'ci' && inputs.mode == 'e2e')) }}
        uses: actions/cache@v4
        with:
          path: .control/cache/buildkit
          key: control-buildkit-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache-scope.outputs.scope }}-${{ hashFiles('bun.lock', 'nx.json', 'src/tooling/control/src/**/*.ts', 'src/systems/**/control.toml', 'src/systems/**/Dockerfile', 'src/backend/apps/**/control.toml', 'src/backend/apps/**/Dockerfile') }}
          restore-keys: |
            control-buildkit-${{ runner.os }}-${{ github.ref_name }}-${{ steps.cache-scope.outputs.scope }}-
            control-buildkit-${{ runner.os }}-${{ github.ref_name }}-
            control-buildkit-${{ runner.os }}-

      - name: Install control packages
        if: ${{ inputs.command == 'build' || (inputs.command == 'ci' && inputs.mode == 'e2e') }}
        env:
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
        run: bun i --filter @metorial/oss --filter @metorial/control

      - name: Install packages
        if: ${{ inputs.command == 'ci' && inputs.mode == 'unit' }}
        env:
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
        run: bun i

      - name: Generate Prisma Clients
        if: ${{ inputs.command == 'ci' && inputs.mode == 'unit' }}
        env:
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
        run: bun x nx run-many --target=prisma:generate --all --parallel=1

      - name: Build platform system clients
        if: ${{ inputs.command == 'ci' && inputs.mode == 'unit' }}
        env:
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
        run: bun x nx run-many --target=build --projects=@metorial-platform-systems/origin-client,@metorial-platform-systems/forge-client,@metorial-platform-systems/function-bay-client,@metorial-platform-systems/signal-client,@metorial-platform-systems/synthesis-client,@metorial-platform-systems/cargo-client,@metorial-platform-systems/ares-client,@metorial/mcp,@metorial/mcp-server,@metorial/mcp-transport-memory,@metorial-platform-systems/shuttle-client,@metorial-platform-systems/slates-client,@metorial-platform-systems/subspace-client

      - name: Run control
        env:
          BUILDX_BUILDER: ${{ steps.buildx.outputs.name }}
          CONTROL_BUILDKIT_CACHE: ${{ inputs.enable_cache && (inputs.command == 'build' || (inputs.command == 'ci' && inputs.mode == 'e2e')) && '1' || '0' }}
          CONTROL_VERBOSE: '1'
          NX_CACHE_DIRECTORY: ${{ github.workspace }}/.nx/cache
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail

          if [ "${{ inputs.command }}" = "build" ]; then
            ARGS=(build)
            if [ "${{ inputs.all }}" = "true" ]; then
              ARGS+=(--all)
            elif [ -n "${{ inputs.filter }}" ]; then
              ARGS+=(--filter "${{ inputs.filter }}")
            fi
          elif [ "${{ inputs.command }}" = "ci" ]; then
            if [ -z "${{ inputs.mode }}" ]; then
              echo "mode is required when command is ci" >&2
              exit 1
            fi
            ARGS=(ci "${{ inputs.mode }}")
            if [ "${{ inputs.all }}" = "true" ]; then
              ARGS+=(--all)
            elif [ -n "${{ inputs.filter }}" ]; then
              ARGS+=(--filter "${{ inputs.filter }}")
            fi
            if [ -n "${{ inputs.project_prefix }}" ]; then
              ARGS+=(--project-prefix "${{ inputs.project_prefix }}")
            fi
            if [ "${{ inputs.mode }}" = "e2e" ] && [ -n "${{ inputs.modules }}" ]; then
              ARGS+=(--module "${{ inputs.modules }}")
            fi
          else
            echo "Unsupported command: ${{ inputs.command }}" >&2
            exit 1
          fi

          bun run control "${ARGS[@]}"

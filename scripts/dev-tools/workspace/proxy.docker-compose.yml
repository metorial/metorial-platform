name: control-proxy

services:
  traefik:
    image: traefik:v3.7.8
    restart: unless-stopped
    command:
      - --configFile=/etc/traefik/traefik.yml
    ports:
      - '3103:3103'
      - '3300:3300'
      - '3301:3301'
      - '3302:3302'
      - '4300:4300'
      - '4301:4301'
      - '4304:4304'
      - '4310:4310'
      - '4311:4311'
      - '4312:4312'
      - '4315:4315'
      - '4318:4318'
      - '4319:4319'
      - '4320:4320'
      - '4321:4321'
      - '4322:4322'
      - '4323:4323'
      - '4350:4350'
      - '4351:4351'
      - '5175:5175'
      - '5176:5176'
      - '6050:6050'
      - '8080:8080'
      - '12121:12121'
      - '52020:52020'
      - '52030:52030'
      - '52040:52040'
      - '52041:52041'
      - '52045:52045'
      - '52046:52046'
      - '52050:52050'
      - '52060:52060'
      - '52070:52070'
      - '52071:52071'
      - '52072:52072'
      - '52080:52080'
      - '52081:52081'
      - '52090:52090'
      - '52091:52091'
      - '52092:52092'
      - '52093:52093'
      - '52110:52110'
      - '52120:52120'
      - '52121:52121'
      - '52122:52122'
      - '52123:52123'
      - '52130:52130'
      - '52131:52131'
      - '52132:52132'
      - '52133:52133'
      - '52134:52134'
      - '52135:52135'
      - '52150:52150'
      - '52151:52151'
      - '52160:52160'
      - '52170:52170'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/etc/traefik/traefik.yml:ro
    networks:
      - control-proxy
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

networks:
  control-proxy:
    name: control_proxy

services:
  postgres-db2:
    image: postgres:17
    restart: unless-stopped
    command: postgres -c max_connections=1000
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workspace-services
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongodb:
    image: mongo:8
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    volumes:
      - mongodb_data:/data/db
    networks:
      - workspace-services
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mongosh --quiet --username mongo --password mongo --authenticationDatabase admin --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis-db:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - workspace-services
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  nats-1:
    image: nats:2.11-alpine
    restart: unless-stopped
    command:
      - --jetstream
      - --store_dir=/data
      - --http_port=8222
    volumes:
      - nats_data:/data
    networks:
      - workspace-services

  etcd:
    image: bitnamilegacy/etcd:latest
    restart: unless-stopped
    environment:
      ALLOW_NONE_AUTHENTICATION: 'yes'
    volumes:
      - etcd_data:/bitnami/etcd
    networks:
      - workspace-services
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  workspace-services:
    internal: true

volumes:
  postgres_data:
  mongodb_data:
  redis_data:
  nats_data:
  etcd_data:

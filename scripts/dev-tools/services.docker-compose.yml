services:
  etcd:
    image: bitnamilegacy/etcd:latest
    ports:
      - '32379:2379'
      - '32380:2380'
    environment:
      - ALLOW_NONE_AUTHENTICATION=yes
    volumes:
      - etcd_1:/bitnami/etcd
    networks:
      - control-services
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'etcdctl', 'endpoint', 'health']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongodb:
    image: mongo:latest
    ports:
      - '32707:27017'
    volumes:
      - mongodb_1:/data/db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongo
      MONGO_INITDB_ROOT_PASSWORD: mongo
    networks:
      - control-services
    healthcheck:
      test:
        [
          'CMD-SHELL',
          "mongosh --quiet --username mongo --password mongo --authenticationDatabase admin --eval 'quit(db.runCommand({ ping: 1 }).ok ? 0 : 2)'",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s

  redis-db:
    image: redis:latest
    ports:
      - '36379:6379'
    volumes:
      - redis_2:/data
    networks:
      - control-services
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  # meilisearch:
  #   image: getmeili/meilisearch:v1.14
  #   ports:
  #     - '37700:7700'
  #   volumes:
  #     - meilisearch_1:/meili_data
  #   environment:
  #     - MEILI_ENV=development
  #   restart: unless-stopped

  postgres-db2:
    image: postgres:17
    ports:
      - '35432:5432'
    volumes:
      - pg_v2_1:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_USER=postgres
    command: postgres -c 'max_connections=1000'
    networks:
      - control-services
    restart: unless-stopped
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  nats-1:
    image: nats
    command: '--cluster_name NATS --cluster nats://0.0.0.0:6222 --http_port 8222'
    ports:
      - '34222:4222'
    networks:
      - control-services
    restart: unless-stopped

